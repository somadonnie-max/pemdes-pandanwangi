<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Verifikasi Surat · Pemerintah Desa Pandanwangi</title>
<link rel="icon" href="../icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Halaman publik verifikasi surat keterangan: kop · status · salinan surat · rincian · cek kode */
:root {
  color-scheme: light;
  --bg: #e9f0ed; --card: #ffffff; --card2: #f6faf8; --ink: #14211c; --muted: #5d6e66; --line: #dde7e2;
  --pri: #0f5a46; --pri2: #0b4838; --pri-soft: #dcede5; --pri-ink: #ffffff;
  --ok: #157347; --ok2: #1f9a5f; --ok-bg: #e4f5eb; --ok-line: #a7dcbd;
  --warn: #8a5a00; --warn2: #c08417; --warn-bg: #fdf1d6; --warn-line: #f0cf7e;
  --bad: #b3261e; --bad2: #d8473d; --bad-bg: #fce4e1; --bad-line: #f1aaa3;
  --sh: 0 1px 1px rgba(10,40,30,.06), 0 4px 10px rgba(10,40,30,.07), 0 14px 30px -12px rgba(10,40,30,.22);
  --hi: inset 0 1px 0 rgba(255,255,255,.9);
  --f-ui: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root {
  color-scheme: dark;
  --bg: #0b1310; --card: #15201c; --card2: #1a2823; --ink: #e4ede9; --muted: #98a9a1; --line: #26352f;
  --pri: #5cc39c; --pri2: #3fa983; --pri-soft: #163a2e; --pri-ink: #062519;
  --ok: #73d8a0; --ok2: #3fb27a; --ok-bg: #143624; --ok-line: #2b6b45;
  --warn: #f2c063; --warn2: #c99430; --warn-bg: #352a10; --warn-line: #6b5420;
  --bad: #f4887f; --bad2: #d8574d; --bad-bg: #3d1f1c; --bad-line: #7a3530;
  --sh: 0 1px 1px rgba(0,0,0,.4), 0 6px 14px rgba(0,0,0,.35), 0 18px 34px -14px rgba(0,0,0,.6);
  --hi: inset 0 1px 0 rgba(255,255,255,.06);
} }
* { box-sizing: border-box }
html { -webkit-text-size-adjust: 100% }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-ui); font-size: 14px; line-height: 1.45;
  padding: calc(16px + env(safe-area-inset-top, 0px)) 14px calc(32px + env(safe-area-inset-bottom, 0px)) }
button:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--pri); outline-offset: 2px }
.wrap { max-width: 460px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px }
.blok { background: linear-gradient(180deg, var(--card), var(--card2)); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--sh), var(--hi) }
.kop { display: flex; gap: 12px; align-items: center; padding: 12px 14px }
.kop img { width: 52px; height: 52px; flex: none; border-radius: 50%; box-shadow: 0 3px 8px rgba(10,40,30,.25), 0 0 0 3px var(--card) }
.kop .t { font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--pri); font-weight: 800 }
.kop .n { font-weight: 800; font-size: 17px; line-height: 1.2 }
.kop .a { font-size: 12px; color: var(--muted) }
.status { display: flex; gap: 12px; align-items: center; padding: 14px; border-width: 1.5px }
.status .ik { width: 46px; height: 46px; flex: none; border-radius: 50%; display: grid; place-items: center; color: #fff; box-shadow: 0 4px 10px -2px rgba(0,0,0,.28), inset 0 2px 0 rgba(255,255,255,.35), inset 0 -3px 0 rgba(0,0,0,.15) }
.status .ik svg { width: 24px; height: 24px }
.status h1 { margin: 0; font-size: 18px; line-height: 1.2; font-weight: 800; text-wrap: balance }
.status p { margin: 3px 0 0; font-size: 12.5px; color: var(--muted) }
.s-ok { background: linear-gradient(180deg, var(--ok-bg), var(--card)); border-color: var(--ok-line) } .s-ok .ik { background: linear-gradient(180deg, var(--ok2), var(--ok)) } .s-ok h1 { color: var(--ok) }
.s-warn { background: linear-gradient(180deg, var(--warn-bg), var(--card)); border-color: var(--warn-line) } .s-warn .ik { background: linear-gradient(180deg, var(--warn2), var(--warn)) } .s-warn h1 { color: var(--warn) }
.s-bad { background: linear-gradient(180deg, var(--bad-bg), var(--card)); border-color: var(--bad-line) } .s-bad .ik { background: linear-gradient(180deg, var(--bad2), var(--bad)) } .s-bad h1 { color: var(--bad) }
.s-info { background: linear-gradient(180deg, var(--pri-soft), var(--card)) } .s-info .ik { background: linear-gradient(180deg, var(--pri2), var(--pri)) } .s-info h1 { color: var(--pri) }
.s-palsu { flex-direction: column; text-align: center; padding: 20px 16px; gap: 8px }
.s-palsu .ik { width: 60px; height: 60px } .s-palsu .ik svg { width: 32px; height: 32px }
.s-palsu h1 { font-size: 20px }
.s-palsu ul { margin: 4px 0 0; padding-left: 18px; text-align: left; font-size: 12.5px; color: var(--muted) }
.surat { padding: 10px; display: flex; flex-direction: column; gap: 8px }
.surat-h { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 0 4px }
.surat-h b { font-size: 13px } .surat-h span { font-size: 11px; background: var(--pri-soft); color: var(--pri); padding: 2px 8px; border-radius: 999px; font-weight: 700 }
.kertas-wrap { border-radius: 12px; background: var(--bg); padding: 10px; box-shadow: inset 0 2px 6px rgba(0,0,0,.08) }
.kertas { position: relative; container-type: inline-size; background: #fff; border-radius: 3px; overflow: hidden; box-shadow: 0 1px 2px rgba(0,0,0,.15), 0 8px 18px -6px rgba(0,0,0,.25) }
.kertas img { display: block; width: 100%; height: auto }
.cap-ttd { position: absolute; width: 19cqw; aspect-ratio: 1; border-radius: 50%; border: .6cqw solid currentColor; display: grid; place-items: center; text-align: center;
  font-family: var(--f-ui); font-weight: 800; font-size: 1.9cqw; letter-spacing: .05em; line-height: 1.15; transform: translate(-50%, -50%) rotate(-12deg); opacity: .88; padding: 1.4cqw; background: rgba(255,255,255,.35) }
.cap-ttd::before { content: ""; position: absolute; inset: 1cqw; border: .25cqw solid currentColor; border-radius: 50% }
.cap-ttd svg { width: 3.6cqw; height: 3.6cqw; display: block; margin: 0 auto .5cqw }
.cap-ttd.ok { color: #15803d } .cap-ttd.warn { color: #b7791f } .cap-ttd.bad { color: #c0262d }
.ket-ttd { position: absolute; transform: translateX(-50%); width: 44cqw; text-align: center; font-family: var(--f-ui); font-size: 1.55cqw; line-height: 1.3; color: #444; background: rgba(255,255,255,.85); border-radius: 1cqw; padding: .4cqw .8cqw }
.salinan { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none }
.salinan span { transform: rotate(-30deg); font-family: var(--f-ui); font-weight: 800; font-size: 6cqw; letter-spacing: .25em; color: rgba(15,90,70,.10); white-space: nowrap }
.batal-diag { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none }
.batal-diag span { transform: rotate(-28deg); font-family: var(--f-ui); font-weight: 800; font-size: 13cqw; letter-spacing: .1em; color: rgba(192,38,45,.24); border: 1.2cqw solid rgba(192,38,45,.24); padding: 1cqw 5cqw; border-radius: 2cqw }
.rinci { padding: 4px 14px }
.rinci .baris { display: grid; grid-template-columns: 104px 1fr; gap: 8px; padding: 5px 0; border-bottom: 1px dashed var(--line); font-size: 12px; align-items: baseline }
.rinci .baris:last-child { border-bottom: 0 }
.rinci dt { color: var(--muted); font-size: 11.5px }
.rinci dd { margin: 0; font-weight: 700; min-width: 0; overflow-wrap: anywhere }
.mono { font-family: var(--f-mono); font-weight: 600; font-size: 11.5px; letter-spacing: .02em }
.sub { font-weight: 500; font-size: 11px; color: var(--muted) }
.cap { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; border-radius: 999px; padding: 1px 8px; border: 1px solid }
.cap.ok { color: var(--ok); background: var(--ok-bg); border-color: var(--ok-line) }
.cap.warn { color: var(--warn); background: var(--warn-bg); border-color: var(--warn-line) }
.cap.bad { color: var(--bad); background: var(--bad-bg); border-color: var(--bad-line) }
.alasan { margin: 2px 0 8px; padding: 7px 10px; border-radius: 10px; background: var(--bad-bg); border: 1px solid var(--bad-line); font-size: 12px }
.cek { padding: 12px 14px; display: flex; flex-direction: column; gap: 10px }
.cocok { padding: 9px 11px; border-radius: 12px; background: var(--pri-soft); font-size: 12px }
.cek label { font-size: 12px; font-weight: 700; color: var(--muted) }
.cek .row { display: flex; gap: 8px }
.cek input { flex: 1; min-width: 0; font: 600 14px var(--f-mono); letter-spacing: .06em; text-transform: uppercase; padding: 9px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); color: var(--ink); box-shadow: inset 0 2px 4px rgba(0,0,0,.06) }
.cek button { font: 800 13.5px var(--f-ui); padding: 9px 18px; border-radius: 12px; border: 0; background: linear-gradient(180deg, var(--pri), var(--pri2)); color: var(--pri-ink); cursor: pointer; box-shadow: 0 4px 10px -3px rgba(15,90,70,.55), inset 0 1px 0 rgba(255,255,255,.25) }
.cek button:active { transform: translateY(1px) }
.kaki { text-align: center; font-size: 11.5px; color: var(--muted); display: flex; flex-direction: column; gap: 2px; padding-top: 2px }
.kaki b { color: var(--ink) }
.skel { height: 74px; border-radius: 18px; background: linear-gradient(90deg, var(--card2), var(--card), var(--card2)); background-size: 200% 100%; animation: kilau 1.2s linear infinite }
@keyframes kilau { to { background-position: -200% 0 } }
@media (prefers-reduced-motion: no-preference) { .wrap > .blok { animation: naik .35s ease-out both } @keyframes naik { from { transform: translateY(5px) } to { transform: none } } }
@media (prefers-reduced-motion: reduce) { .skel { animation: none } }
@media (max-width: 360px) { .rinci .baris { grid-template-columns: 1fr; gap: 0 } }
</style>
</head>
<body>
<main class="wrap" id="wrap" aria-live="polite">
  <header class="blok kop"><img src="../icon-192.png" alt="Logo Pemerintah Desa Pandanwangi"><div><div class="t">Verifikasi Surat</div><div class="n">Pemerintah Desa Pandanwangi</div><div class="a">Kecamatan Tempeh · Kabupaten Lumajang</div></div></header>
  <div class="skel"></div>
</main>
<script>
(() => {
const API = 'https://niaqgsqfsztcsgdyzavt.supabase.co/functions/v1/berkas';
const IK = {
  ok: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  warn: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>',
  x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><path d="M7 7l10 10M17 7L7 17"/></svg>',
  alert: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5L2.5 20h19L12 3.5z"/><path d="M12 10v4.5M12 17.4v.1"/></svg>',
  qr: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><path d="M14 14h2v2h-2zM18 18h2v2h-2zM14 18h2M18 14h2"/></svg>'
};
const esc = t => String(t == null ? '' : t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const BLN = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
const HARI = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
const tglPanjang = s => { const m = String(s || '').match(/^(\d{4})-(\d{2})-(\d{2})/); if (!m) return esc(s); const d = new Date(+m[1], +m[2] - 1, +m[3]); return HARI[d.getDay()] + ', ' + (+m[3]) + ' ' + BLN[+m[2] - 1] + ' ' + m[1]; };
const waktu = s => { const m = String(s || '').match(/^(\d{4})-(\d{2})-(\d{2}) (\d{2}):(\d{2})/); return m ? (+m[3]) + ' ' + BLN[+m[2] - 1].slice(0, 3) + ' ' + m[1] + ', ' + m[4] + '.' + m[5] + ' WIB' : ''; };
const wrap = document.getElementById('wrap');
const kop = wrap.querySelector('.kop').outerHTML;
const b = (l, v) => '<div class="baris"><dt>' + l + '</dt><dd>' + v + '</dd></div>';
const kaki = '<div class="kaki"><div>Halaman ini hanya menampilkan data ringkas. Data lengkap tersimpan di Kantor Desa.</div><div>Ragu dengan keaslian surat? Hubungi <b>Kantor Desa Pandanwangi</b>.</div></div>';

function formCek(st) {
  const pesan = st === 'palsu' || !st ? '' : st === 'menunggu'
    ? '<div class="cocok"><b>Belum bisa dipakai.</b> Bila surat ini sudah Anda terima lengkap dengan tanda tangan dan stempel, mohon tanyakan ke Kantor Desa.</div>'
    : '<div class="cocok"><b>Cocokkan dengan kertasnya.</b> Nama, NIK, nomor dan jenis surat di atas harus sama dengan yang tertulis di surat. Bila berbeda, surat itu bukan asli.</div>';
  return '<section class="blok cek">' + pesan + '<label for="kode">' + (st ? 'Periksa kode lain (tertulis di bawah QR surat)' : 'Ketik kode cek yang tertulis di bawah QR surat') + '</label><div class="row"><input id="kode" placeholder="PDW-XXXX-XXXX" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="13" inputmode="text"><button type="button" id="cekBtn">Periksa</button></div></section>';
}
function pasangCek() {
  const inp = document.getElementById('kode'), btn = document.getElementById('cekBtn');
  if (!inp) return;
  btn.addEventListener('click', () => {
    let k = inp.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (k.indexOf('PDW') === 0) k = k.slice(3);
    if (k.length !== 8) { inp.focus(); inp.setCustomValidity('Kode terdiri dari 8 huruf/angka setelah PDW-'); inp.reportValidity(); return; }
    inp.setCustomValidity('');
    const kode = 'PDW-' + k.slice(0, 4) + '-' + k.slice(4);
    history.replaceState(null, '', location.pathname + '?kode=' + kode);
    muat({ kode });
  });
  inp.addEventListener('input', () => inp.setCustomValidity(''));
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') btn.click(); });
}
function surat(d) {
  if (!d.gambar_url) return '';
  const p = d.pos && d.pos.x ? d.pos : { x: .72, y: .80, yb: .83 };
  const capY = Math.max(.08, p.y - .045), ketY = (p.yb || p.y + .02) + .006;
  const cap = d.status === 'sah' ? '<div class="cap-ttd ok">' + IK.ok + 'TELAH<br>DISETUJUI</div>' : d.status === 'menunggu' ? '<div class="cap-ttd warn">' + IK.warn + 'BELUM<br>DISAHKAN</div>' : '<div class="cap-ttd bad">' + IK.x + 'DIBATAL-<br>KAN</div>';
  const ket = d.status === 'sah' ? 'Ditandatangani ' + esc(d.ttd_ket || '') + '; disahkan di sistem desa ' + esc(waktu(d.disahkan)) + '. Tanda tangan asli ada pada surat fisik.'
    : d.status === 'menunggu' ? 'Menunggu tanda tangan. Surat belum berlaku.' : 'Dibatalkan ' + esc(waktu(d.dibatalkan)) + '. Surat tidak berlaku.';
  return '<section class="blok surat"><div class="surat-h"><b>Tampilan surat</b><span>data pribadi disamarkan</span></div><div class="kertas-wrap"><div class="kertas">'
    + '<img src="' + esc(d.gambar_url) + '" alt="Salinan surat dengan data pribadi disamarkan">'
    + '<div class="salinan"><span>SALINAN VERIFIKASI</span></div>'
    + cap.replace('class="cap-ttd', 'style="left:' + (p.x * 100).toFixed(2) + '%;top:' + (capY * 100).toFixed(2) + '%" class="cap-ttd')
    + '<div class="ket-ttd" style="left:' + (p.x * 100).toFixed(2) + '%;top:' + (ketY * 100).toFixed(2) + '%">' + ket + '</div>'
    + (d.status === 'batal' ? '<div class="batal-diag"><span>BATAL</span></div>' : '') + '</div></div></section>';
}
function rinci(d) {
  const R = [b('Jenis surat', esc(d.jenis)), b('Nomor surat', '<span class="mono">' + esc(d.nomor) + '</span>'), b('Nama', esc(d.nama))];
  if (d.nik) R.push(b('NIK', '<span class="mono">' + esc(d.nik) + '</span>'));
  R.push(b('Tanggal surat', tglPanjang(d.tgl)));
  if (d.status === 'sah') R.push(b('Ditandatangani', esc(d.ttd_nama || '') + (d.ttd_ket ? ' <span class="sub">· ' + esc(d.ttd_ket) + '</span>' : '')), b('Disahkan', esc(waktu(d.disahkan)) + ' <span class="sub">· oleh petugas desa</span>'), b('Status', '<span class="cap ok">● Berlaku</span>'));
  if (d.status === 'menunggu') R.push(b('Dicetak', esc(waktu(d.dicetak))), b('Status', '<span class="cap warn">● Menunggu tanda tangan</span>'));
  if (d.status === 'batal') R.push(b('Dibatalkan', esc(waktu(d.dibatalkan))), b('Status', '<span class="cap bad">● Tidak berlaku</span>'));
  R.push(b('Kode cek', '<span class="mono">' + esc(d.kode) + '</span>'));
  return '<section class="blok rinci"><dl style="margin:0">' + R.join('') + '</dl>' + (d.status === 'batal' && d.alasan ? '<div class="alasan"><b>Alasan:</b> ' + esc(d.alasan) + '</div>' : '') + '</section>';
}
const STATUS = {
  sah: d => '<section class="blok status s-ok"><div class="ik">' + IK.ok + '</div><div><h1>Surat Sah</h1><p>Surat ini benar dikeluarkan Pemerintah Desa ' + esc(d.desa || 'Pandanwangi') + ' dan telah ditandatangani ' + esc(d.ttd_ket || 'pejabat yang berwenang') + '.</p></div></section>',
  menunggu: () => '<section class="blok status s-warn"><div class="ik">' + IK.warn + '</div><div><h1>Belum Disahkan</h1><p>Surat sudah dibuat tetapi belum dicatat sebagai surat yang ditandatangani. Surat belum berlaku.</p></div></section>',
  batal: () => '<section class="blok status s-bad"><div class="ik">' + IK.x + '</div><div><h1>Surat Dibatalkan</h1><p>Surat ini pernah dikeluarkan, tetapi sudah dibatalkan dan tidak berlaku lagi.</p></div></section>',
  palsu: () => '<section class="blok status s-bad s-palsu"><div class="ik">' + IK.alert + '</div><h1>Dokumen Tidak Ditemukan atau Palsu!</h1><p>Kode pada surat ini tidak terdaftar di sistem Pemerintah Desa Pandanwangi.</p><ul><li>Pastikan QR dipindai dari surat aslinya.</li><li>Atau ketik kode cek yang tertulis di bawah QR.</li><li>Bila tetap tidak ditemukan, jangan terima surat ini dan laporkan ke Kantor Desa.</li></ul></section>',
  awal: () => '<section class="blok status s-info"><div class="ik">' + IK.qr + '</div><div><h1>Periksa Keaslian Surat</h1><p>Pindai QR pada surat keterangan dari Desa Pandanwangi, atau ketik kode cek di bawah QR.</p></div></section>',
  galat: m => '<section class="blok status s-warn"><div class="ik">' + IK.alert + '</div><div><h1>Belum Bisa Memeriksa</h1><p>' + esc(m) + '</p></div></section>'
};
function tampil(html, st) { wrap.innerHTML = kop + html + formCek(st) + kaki; pasangCek(); }
async function muat(q) {
  wrap.innerHTML = kop + '<div class="skel"></div>';
  try {
    const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(Object.assign({ action: 'vfCek' }, q)) }).then(x => x.json());
    if (!r || !r.ok) throw new Error((r && r.error) || 'Server tidak menjawab.');
    const d = r.data || {};
    if (!d.ada) return tampil(STATUS.palsu(), 'palsu');
    const st = ['sah', 'menunggu', 'batal'].indexOf(d.status) >= 0 ? d.status : 'batal';
    document.title = (st === 'sah' ? 'Surat Sah' : st === 'menunggu' ? 'Belum Disahkan' : 'Surat Dibatalkan') + ' · Verifikasi Surat Desa Pandanwangi';
    tampil(STATUS[st](d) + surat(d) + rinci(d), st);
  } catch (e) {
    tampil(STATUS.galat('Periksa sambungan internet lalu muat ulang halaman ini. (' + (e.message || e) + ')'), 'galat');
  }
}
const sp = new URLSearchParams(location.search), id = (sp.get('id') || '').trim(), kode = (sp.get('kode') || '').trim();
if (id) muat({ id }); else if (kode) muat({ kode }); else tampil(STATUS.awal(), '');
})();
</script>
</body>
</html>
