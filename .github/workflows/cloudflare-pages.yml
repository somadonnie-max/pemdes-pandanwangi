name: Kirim ke Cloudflare Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  kirim:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Lewati jika kunci Cloudflare belum diisi
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '' }}
        run: echo "Kunci Cloudflare belum diisi di Settings > Secrets. Dilewati."
      - name: Siapkan folder situs
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          mkdir _situs
          rsync -a --exclude '.git' --exclude '.github' --exclude '_situs' ./ _situs/
      - name: Buat proyek Pages jika belum ada
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: npx --yes wrangler@3 pages project create pemdespandanwangi --production-branch=main || true
      - name: Kirim
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: npx --yes wrangler@3 pages deploy _situs --project-name=pemdespandanwangi --branch=main --commit-dirty=true
