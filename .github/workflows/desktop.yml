name: Bangun aplikasi desktop Windows
on:
  workflow_dispatch:
  push:
    tags: ['desktop-v*']
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Pasang pustaka
        run: npm install
      - name: Bangun exe
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Simpan hasil
        uses: actions/upload-artifact@v4
        with:
          name: pemdes-pandanwangi-windows
          path: desktop/dist/*.exe
      - name: Terbitkan di Releases
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/dist/*.exe
