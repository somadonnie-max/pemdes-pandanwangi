<style>
:root{
  --bg:#f2f5f4; --surface:#ffffff; --surface2:#eaf0ed; --ink:#15211c; --muted:#5f6f68; --line:#dde5e1;
  --pri:#0f5a46; --pri-2:#0b4838; --pri-ink:#ffffff; --pri-soft:#dcede5;
  --gold:#b0770c; --gold-soft:#f8edd3;
  --ok:#1d7a48; --ok-soft:#dff2e6; --warn:#98640a; --warn-soft:#fbeed3; --bad:#b3261e; --bad-soft:#fae1de; --info:#1d5f9e; --info-soft:#e1ecf7;
  --shadow:0 1px 2px rgba(15,40,30,.05),0 4px 14px rgba(15,40,30,.06);
  --r:10px; --font:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0d1512; --surface:#141f1b; --surface2:#1b2924; --ink:#e4ede9; --muted:#95a69e; --line:#27362f;
    --pri:#58c39b; --pri-2:#3fa983; --pri-ink:#062519; --pri-soft:#163a2e;
    --gold:#e4b24a; --gold-soft:#3a2d12;
    --ok:#5cc98b; --ok-soft:#173a28; --warn:#e3ad4c; --warn-soft:#3b2d12; --bad:#f0827a; --bad-soft:#442320; --info:#7fb1e6; --info-soft:#1b2d42;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0d1512; --surface:#141f1b; --surface2:#1b2924; --ink:#e4ede9; --muted:#95a69e; --line:#27362f;
  --pri:#58c39b; --pri-2:#3fa983; --pri-ink:#062519; --pri-soft:#163a2e;
  --gold:#e4b24a; --gold-soft:#3a2d12;
  --ok:#5cc98b; --ok-soft:#173a28; --warn:#e3ad4c; --warn-soft:#3b2d12; --bad:#f0827a; --bad-soft:#442320; --info:#7fb1e6; --info-soft:#1b2d42;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.45 var(--font);-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--pri)}
h1,h2,h3{margin:0;line-height:1.25;text-wrap:balance}
.mono{font-family:var(--mono);font-size:.9em;letter-spacing:-.02em}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.ic{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- shell ---------- */
.app{min-height:100%;display:flex}
.side{display:none}
.shell{flex:1;min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--pri);color:var(--pri-ink);display:flex;align-items:center;gap:6px;padding:6px 10px;min-height:46px}
.top .title{flex:1;min-width:0;font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sub{display:inline;font-weight:500;font-size:11.5px;opacity:.75;margin-left:6px}
.iconbtn{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:9px;border:0;background:transparent;color:inherit;cursor:pointer}
.iconbtn .ic{width:18px;height:18px}
.iconbtn:hover{background:rgba(255,255,255,.12)}
main{flex:1;width:100%;max-width:1100px;margin:0 auto;padding:10px 10px 84px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{flex:1;border:0;background:none;padding:6px 4px 7px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:10.5px;font-weight:600;color:var(--muted);cursor:pointer}
.tabs button.on{color:var(--pri)}
.tabs .ic{width:19px;height:19px}
@media (min-width:900px){
  .side{display:flex;flex-direction:column;width:224px;flex:none;position:sticky;top:0;height:100vh;overflow:auto;background:var(--surface);border-right:1px solid var(--line);padding:12px 8px}
  .tabs{display:none}
  main{padding:14px 18px 32px}
}
.brand{display:flex;gap:8px;align-items:center;padding:2px 6px 10px}
.seal{width:32px;height:32px;border-radius:9px;background:var(--pri);color:var(--pri-ink);display:grid;place-items:center;font-weight:800;font-size:12px;flex:none}
.seal img{width:100%;height:100%;object-fit:contain;border-radius:9px;background:#fff}
.seal.logo{background:none;border-radius:50%}.seal.logo img{border-radius:50%}
.login .seal.logo{width:52px;height:52px}
.tlogo{width:28px;height:28px;border-radius:50%;flex:none;background:#fff;object-fit:contain}
@media (min-width:900px){.tlogo{display:none}}
.brand b{display:block;font-size:13px}
.brand span{font-size:11px;color:var(--muted)}
.nav-h{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:10px 8px 2px}
.nav-i{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;text-align:left;padding:5px 8px;border-radius:7px;cursor:pointer;font-size:12.5px;color:var(--ink)}
.nav-i:hover{background:var(--surface2)}
.nav-i.on{background:var(--pri-soft);color:var(--pri);font-weight:600}
.nav-i .ic{width:15px;height:15px;color:var(--muted)}
.nav-i.on .ic{color:var(--pri)}

/* ---------- blocks ---------- */
.stack{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 2px -2px}
.sec-h h2{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.grid{display:grid;gap:6px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.tile{display:flex;gap:8px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:7px 9px;cursor:pointer;min-height:42px;transition:border-color .15s,background .15s}
.tile:hover{border-color:var(--pri);background:var(--pri-soft)}
.tile .ti{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;background:var(--pri-soft);color:var(--pri);flex:none}
.tile b{font-size:12px;font-weight:600;line-height:1.25;flex:1;min-width:0}
.tile small{color:var(--muted);font-size:10.5px;display:block;font-weight:500}
.tile.soon{opacity:.6}
.tile .cnt{font-family:var(--mono);font-size:10.5px;color:var(--muted)}

.hero{background:linear-gradient(135deg,var(--pri),var(--pri-2));color:var(--pri-ink);border-radius:12px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-30px;top:-40px;width:120px;height:120px;border-radius:50%;border:18px solid rgba(255,255,255,.07)}
.hero .hi{font-size:11.5px;opacity:.85}
.hero h1{font-size:14.5px;font-weight:700}
.hero .who{flex:1;min-width:150px}
.clock{font-family:var(--mono);font-size:20px;font-weight:500;letter-spacing:-.03em;line-height:1}
.hero .hrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;position:relative;z-index:1;width:100%}
.hero .hrow .hi{flex:1;min-width:160px}
.hero .btn{background:var(--pri-ink);color:var(--pri);border-color:transparent}
.hero .ghost{background:rgba(255,255,255,.14);color:var(--pri-ink);border-color:rgba(255,255,255,.22)}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:6px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:6px 9px;text-align:left;cursor:default}
button.stat{cursor:pointer}
button.stat:hover{border-color:var(--pri)}
.stat b{display:block;font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.stat span{font-size:10.5px;color:var(--muted)}

.pill{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.info{background:var(--info-soft);color:var(--info)}
.pill.pri{background:var(--pri-soft);color:var(--pri)} .pill.gold{background:var(--gold-soft);color:var(--gold)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:5px 11px;font-weight:600;font-size:12.5px;cursor:pointer;min-height:32px;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--pri)}
.btn.pri{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}
.btn.pri:hover{background:var(--pri-2)}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.danger.solid{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.sm{min-height:26px;padding:2px 8px;font-size:11.5px;border-radius:7px}
.btn.sm .ic{width:14px;height:14px}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.btn.block{width:100%}
.btns{display:flex;flex-wrap:wrap;gap:6px;align-items:center}

const S = { token: store.get('token'), user: null, perms: [], set: {}, stack: [], cur: null, seq: 0, rkpYear: null, vh: {} };

const FILE_ACTIONS = ['upload', 'fileData', 'makeDoc', 'tplList', 'makeKK', 'toPdf', 'tplSources', 'tplExport'];
function call(action, p, bearer) {
  const req = Object.assign({ action, token: S.token }, p || {});
  const berkas = FILE_ACTIONS.indexOf(action) >= 0;
  const h = berkas ? { 'Content-Type': 'text/plain;charset=utf-8' } : { 'Content-Type': 'application/json', apikey: SB_KEY };
  if (!berkas) h.Authorization = 'Bearer ' + (bearer || SB_KEY);
  if (!berkas && !bearer && !/^eyJ/.test(SB_KEY)) delete h.Authorization;
  return fetch(berkas ? FILE_URL : SB_URL + '/rest/v1/rpc/api', { method: 'POST', headers: h, body: JSON.stringify(berkas ? req : { req }) })
    .then(r => r.json()).catch(() => { throw new Error('Tidak ada koneksi ke server. Periksa internet Anda.'); })
    .then(r => {
      if (r && r.ok) return r.data;
      const e = new Error((r && (r.error || r.message || r.msg)) || 'Terjadi kesalahan.');
      e.code = r && r.code;
      if (e.code === 'AUTH' && action !== 'login') { logoutLocal(); toast(e.message, 1); }
      throw e;
    });
}

      throw e;

}

const THUMB = {}, thumbTried = new Set();
function thumb(id, sz) {
  if (!id || id === '•') return '';

/* Ganti gambar Drive (lambat) dengan gambar kecil tersimpan di Supabase (cepat). */
let thumbTm = null;
async function hydrateThumbs() {
  if (!S.token) return;
  const imgs = $$('img[src*="drive.google.com/thumbnail"]');
  if (!imgs.length) return;
  const idOf = i => { try { return new URL(i.src).searchParams.get('id'); } catch (e) { return null; } };
  const ids = Array.from(new Set(imgs.map(idOf))).filter(x => x && !THUMB[x] && !thumbTried.has(x));
  if (ids.length) {
    ids.forEach(x => thumbTried.add(x));
    try { Object.assign(THUMB, await call('thumbGet', { ids })); } catch (e) { }
  }
  imgs.forEach(i => { const t = THUMB[idOf(i)]; if (t && i.isConnected) i.src = t; });
}
new MutationObserver(() => { clearTimeout(thumbTm); thumbTm = setTimeout(hydrateThumbs, 40); }).observe(document.body, { childList: true, subtree: true });
async function makeThumb(file) {
  const img = await loadImg(file);
  const s = Math.min(1, 240 / Math.max(img.width, img.height));
  const c = document.createElement('canvas');
  c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', .7);
}
function driveUrl(id) { return `https://drive.google.com/file/d/${encodeURIComponent(id)}/view`; }
async function viewFile(id, priv, name) {
  if (!id || id === '•') return toast('Anda tidak punya izin melihat dokumen ini.', 1);
  if (!priv) { window.open(driveUrl(id), '_blank', 'noopener'); return; }
  const m = modal(name || 'Dokumen', '<div class="skel" style="height:240px"></div>', { big: 1 });
  if (isSbFile(id)) {
    try {
      const r = await callBerkas('get', { id });
      m.body.innerHTML = /\.pdf$/i.test(id)
        ? `<a class="btn pri" href="${esc(r.url)}" target="_blank" rel="noopener">${ic('eye')}Buka berkas PDF</a>`

    return;
  }
  try {

      ? `<img src="${url}" alt="" style="width:100%;border-radius:12px">`
      : `<p>Berkas ${esc(f.mime)}.</p><a class="btn pri" href="${url}" target="_blank" rel="noopener">${ic('eye')}Buka berkas</a>`;
  } catch (e) { m.body.innerHTML = `<div class="err">${esc(e.message)}</div>`; }

function readB64(file) {
  return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.onerror = () => rej(new Error('Gagal membaca berkas.')); r.readAsDataURL(file); });
}
function loadImg(file) {
  return new Promise((res, rej) => { const u = URL.createObjectURL(file); const i = new Image(); i.onload = () => { res(i); URL.revokeObjectURL(u); }; i.onerror = () => rej(new Error('Foto tidak dapat dibaca.')); i.src = u; });
}
/** Perkecil foto; stamp = teks bukti di bagian bawah (untuk presensi). */
async function shrink(file, max, stamp) {
  const img = await loadImg(file);
  const s = Math.min(1, (max || 1600) / Math.max(img.width, img.height));
  const c = document.createElement('canvas');
  c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
  const g = c.getContext('2d');
  g.drawImage(img, 0, 0, c.width, c.height);
  if (stamp) {
    const fs = Math.max(14, Math.round(c.width / 32));
    const lines = stamp.split('\n');
    const bh = fs * 1.45 * lines.length + fs;
    g.fillStyle = 'rgba(0,0,0,.55)'; g.fillRect(0, c.height - bh, c.width, bh);
    g.fillStyle = '#fff'; g.font = `600 ${fs}px sans-serif`;
    lines.forEach((l, i) => g.fillText(l, fs * .7, c.height - bh + fs * 1.3 + i * fs * 1.45));
  }
  return c.toDataURL('image/jpeg', .74).split(',')[1];
}
/** Perkecil foto menjadi JPEG (Blob) sampai di bawah target ukuran. */
async function shrinkBlob(file, max, target) {
  const img = await loadImg(file);
  let dim = max, q = .78, b = null;
  for (let i = 0; i < 7; i++) {
    const s = Math.min(1, dim / Math.max(img.width, img.height));
    const c = document.createElement('canvas');
    c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
    const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
    b = await new Promise(r => c.toBlob(r, 'image/jpeg', q));
    if (!b || b.size <= target) break;
    if (q > .6) q -= .08; else dim = Math.round(dim * .85);
  }
  if (!b) throw new Error('Foto tidak dapat diproses.');
  return b;
}
/** Unggah foto KTP/KK ke penyimpanan kependudukan (privat). */
async function uploadKependudukan(file, folder) {
  const kk = /KK/i.test(String(folder).split('/')[1] || '');
  let blob, mime = file.type || '';
  if (/^image\//.test(mime) && !/gif|svg/.test(mime)) { blob = await shrinkBlob(file, kk ? 2000 : 1400, kk ? 450e3 : 250e3); mime = 'image/jpeg'; }
  else if (mime === 'application/pdf') blob = file;
  else throw new Error('Unggah foto (JPG/PNG) atau PDF.');
  if (blob.size > 3 * 1024 * 1024) throw new Error('Ukuran berkas maksimal 3 MB.');
  const r = await callBerkas('up', { jenis: kk ? 'kk' : 'ktp', size: blob.size, mime });
  const up = await fetch(r.url, { method: 'PUT', headers: { 'Content-Type': mime, 'x-upsert': 'false' }, body: blob }).catch(() => null);
  if (!up || !up.ok) throw new Error('Gagal mengunggah foto' + (up ? ' (' + up.status + ')' : '') + '. Coba lagi.');
  return { id: r.id, size: blob.size };
}
async function uploadFile(file, folder) {
  if (String(folder || '').split('/')[0] === 'Penduduk') {
    try { return await uploadKependudukan(file, folder); }
    catch (e) { if (!/belum dipasang/.test(e.message)) throw e; }   /* penyimpanan baru belum siap: pakai Drive */
  }
  if (file.size > 25 * 1024 * 1024) throw new Error('Ukuran berkas maksimal 25 MB.');
  let data, mime = file.type || 'application/octet-stream', name = file.name;
  if (mime.indexOf('image') === 0 && !/gif|svg/.test(mime)) { data = await shrink(file, 2000); mime = 'image/jpeg'; name = name.replace(/\.\w+$/, '') + '.jpg'; }
  else data = await readB64(file);
  const r = await call('upload', { folder, name, mime, data });
  /* gambar kecil disimpan di Supabase, kecuali dokumen kependudukan (privat) */
  if (mime.indexOf('image') === 0 && String(folder || '').split('/')[0] !== 'Penduduk') {
    try { const t = await makeThumb(file); THUMB[r.id] = t; await call('thumbSave', { id: r.id, data: t }); } catch (e) { }
  }
  return r;
}

    try { const r = await call('loginGoogle', {}, hp.get('access_token')); S.token = r.token; store.set('token', r.token); store.set('last_email', r.user.email); }
    catch (x) { return loginScreen(x.message); }
  }
  if (!S.token) return loginScreen();
  try {
    const me = await call('me');
    S.user = me.user; S.perms = me.perms; S.set = me.settings || {};
    S.faceOn = !!S.user.wajah;
    S.rkpYear = S.rkpYear || S.set.tahun_rkp || String(new Date().getFullYear() + 1);

}

const VIEWS = {};

function clockTick(el) {
  const f = () => { const d = new Date(); el.textContent = pad2(d.getHours()) + ':' + pad2(d.getMinutes()) + ':' + pad2(d.getSeconds()); };
  f(); S.timer = setInterval(f, 1000);
}
/* Jendela waktu presensi (lihat PANDUAN): pagi = Masuk/DL/Izin/Sakit, pulang = Pulang */
function presWin(jamNow) {
  const st = S.set, n = new Date();
  const hm = jamNow ? String(jamNow).slice(0, 5) : pad2(n.getHours()) + ':' + pad2(n.getMinutes());
  const W = { mulai: st.jam_masuk_mulai || '06:30', batas: st.jam_masuk_batas || '08:30', pul: (n.getDay() === 5 ? st.jam_pulang_jumat : st.jam_pulang_mulai) || '14:00', tutup: st.jam_pulang_batas || '23:59' };
  W.tahap = hm < W.mulai ? 'belum' : hm < W.pul ? 'pagi' : hm < W.tutup ? 'pulang' : 'tutup';
  return W;
}
/* Sakit, Pulang, atau Izin yang menutup hari (setelah masuk/dinas luar, atau setelah batas masuk) */
function presSelesai(rec) {
  const batas = S.set.jam_masuk_batas || '08:30';
  return rec.some((x, i) => x.jenis === 'Sakit' || x.jenis === 'Pulang' || (x.jenis === 'Izin' && (String(x.jam).slice(0, 5) > batas || rec.slice(0, i).some(y => y.jenis === 'Masuk' || y.jenis === 'Dinas Luar'))));
}
/* Kode rekap satu hari: [pagi/datang, siang/pulang] */
function kodeHari(recs, batas, closed) {
  const at = j => recs.findIndex(x => x.jenis === j);
  const iM = at('Masuk'), iD = at('Dinas Luar'), iP = at('Pulang'), iI = at('Izin'), iS = at('Sakit');
  const w1 = i => String(recs[i].jam).slice(0, 5) <= batas;
  let pagi = '', siang = '';
  if (iM >= 0) pagi = (iI >= 0 && iI < iM ? 'IT' : w1(iM) ? 'H' : 'T') + (iD >= 0 ? 'D' : '');
  else if (iD >= 0) pagi = iI >= 0 && iI < iD ? 'ITD' : w1(iD) ? 'D' : 'TD';
  else if (iI >= 0) pagi = w1(iI) ? 'I' : 'TI';
  else if (iS >= 0) pagi = w1(iS) ? 'S' : 'TS';
  else if (closed) pagi = 'A';
  const aktif = iM >= 0 || iD >= 0;
  if (iP >= 0) siang = 'P';
  else if (iS >= 0) siang = 'S';
  else if (iI >= 0 && (!aktif || iI > Math.min(...[iM, iD].filter(x => x >= 0)))) siang = 'I';
  else if (closed) siang = aktif ? 'PA' : 'A';
  return [pagi, siang];
}
function presSummary(p) {
  const r = p.records || [];
  const m = r.find(x => x.jenis === 'Masuk' || x.jenis === 'Dinas Luar' || x.jenis === 'Izin' || x.jenis === 'Sakit');
  const pl = r.find(x => x.jenis === 'Pulang');
  if (p.libur) return { text: 'Hari libur: ' + p.libur, next: null };
  if (!m) return { text: 'Anda belum presensi hari ini.', next: 'Masuk' };
  if (/Izin|Sakit/.test(m.jenis)) return { text: m.jenis + ' tercatat pukul ' + String(m.jam).slice(0, 5) + '.', next: null };
  if (!pl) return { text: m.status + ' pukul ' + String(m.jam).slice(0, 5) + '. Jangan lupa presensi pulang.', next: 'Pulang' };
  return { text: 'Masuk ' + String(m.jam).slice(0, 5) + ', pulang ' + String(pl.jam).slice(0, 5) + '. Terima kasih.', next: null };
}

/* ---------------- Pengenal wajah (di perangkat) ----------------
   Memakai face-api (TensorFlow.js). Kamera hanya dipakai di HP ini;
   yang dikirim ke server hanya 128 angka pola wajah, bukan gambar. */
const FACE_LIB = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.15/dist/face-api.js';
const FACE_MODELS = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.15/model';
let faceReady = null;
function loadFace() {
  if (faceReady) return faceReady;
  faceReady = new Promise((res, rej) => {
    if (window.faceapi) return res();
    const s = document.createElement('script'); s.src = FACE_LIB; s.onload = res;
    s.onerror = () => rej(new Error('Pengenal wajah gagal dimuat. Periksa internet lalu coba lagi.'));
    document.head.appendChild(s);
  }).then(() => Promise.all([
    faceapi.nets.tinyFaceDetector.loadFromUri(FACE_MODELS),
    faceapi.nets.faceLandmark68Net.loadFromUri(FACE_MODELS),
    faceapi.nets.faceRecognitionNet.loadFromUri(FACE_MODELS)
  ])).catch(e => { faceReady = null; throw new Error('Pengenal wajah gagal dimuat. Periksa internet lalu coba lagi.'); });
  return faceReady;
}
const sleep = ms => new Promise(r => setTimeout(r, ms));
function vMean(list) { const o = new Array(128).fill(0); list.forEach(v => v.forEach((x, i) => o[i] += x / list.length)); return o; }
function vDist(a, b) { let s = 0; for (let i = 0; i < a.length; i++) s += (a[i] - b[i]) * (a[i] - b[i]); return Math.sqrt(s); }
/* Pindai wajah + cek wajah hidup: lihat lurus, toleh ke satu sisi, toleh ke sisi lain, lihat lurus lagi. */
async function faceScan(box, enroll) {
  const video = $('video', box), msg = $('.fmsg', box), bar = $('.fbar i', box);
  const say = (t, p) => { msg.textContent = t; if (p != null) bar.style.width = p + '%'; };
  box.classList.remove('done');
  say('Memuat pengenal wajah… (pertama kali ±6 MB)', 5);
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('Kamera tidak didukung di peramban ini.');
  const camP = navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } }, audio: false })

document.addEventListener('change', async ev => {
  const inp = ev.target;
  if (!inp.matches || !inp.matches('.titik input[data-pct]') || !inp.files[0]) return;
  const card = inp.closest('.titik'), pct = inp.dataset.pct, lab = inp.closest('label');
  lab.classList.add('busy'); lab.firstChild.textContent = 'Mengunggah…';
  try {
    const up = await uploadFile(inp.files[0], 'Pembangunan');
    await call('save', { entity: 'pembangunan_titik', record: { id: card.dataset.id, ['foto_' + pct]: up.id, ['tgl_' + pct]: isoToday() } });
    await syncPembangunan(card.dataset.ref, up.id);
    toast('Foto ' + pct + '% tersimpan.');
    const xx = card.closest('.xx'); if (xx) extraPembangunan({ id: card.dataset.ref }, xx);
  } catch (x) { toast(x.message, 1); lab.classList.remove('busy'); lab.firstChild.textContent = 'Unggah'; }
});
/* progres pekerjaan = rata-rata progres semua titik */
async function syncPembangunan(ref, cover) {
  const r = await call('list', { entity: 'pembangunan_titik', filters: { ref }, limit: 200 });
  const ps = r.rows.map(t => Math.max(0, pctOf(t)));
  const rec = { id: ref, jml_titik: String(r.rows.length), progres: String(ps.length ? Math.round(ps.reduce((a, b) => a + b, 0) / ps.length) : 0) };
  if (cover) rec.foto_id = cover;
  await call('save', { entity: 'pembangunan', record: rec });
}
ACT.delTitik = t => {

/* ---------------- Formulir ---------------- */
function fieldHtml(f, v, rec) {
  const id = 'f_' + f.k;
  const req = f.req ? ' <i>*</i>' : '';
  const lab = `<label for="${id}">${esc(f.l)}${req}</label>`;
  const hint = f.hint ? `<span class="hint">${esc(f.hint)}</span>` : '';
  const wide = f.wide || /textarea|file|sdgs|refpick/.test(f.t) ? ' wide' : '';
  v = v == null ? '' : String(v);
  let inp;
  switch (f.t) {
    case 'textarea': inp = `<textarea id="${id}" rows="3">${esc(v)}</textarea>`; break;
    case 'select': {
      const opts = f.opt.slice(); if (v && opts.indexOf(v) < 0) opts.unshift(v);
      inp = `<select id="${id}"><option value="">— pilih —</option>${opts.map(o => `<option ${o === v ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select>`; break;
    }
    case 'money': inp = `<input id="${id}" inputmode="numeric" data-money value="${v ? Number(nOnly(v)).toLocaleString('id-ID') : ''}" placeholder="0">`; break;
    case 'date': inp = `<input id="${id}" type="date" value="${esc(v)}">`; break;
    case 'time': inp = `<input id="${id}" type="time" value="${esc(String(v).slice(0, 5))}">`; break;
    case 'number': inp = `<input id="${id}" type="number" inputmode="numeric" value="${esc(v)}">`; break;
    case 'geo': inp = `<div class="btns" style="flex-wrap:nowrap"><input id="${id}" value="${esc(v)}" placeholder="-8.2367, 113.1907" style="flex:1"><button type="button" class="btn sm" data-act="geo" data-t="${id}">${ic('pin')}Lokasi saya</button></div>`; break;
    case 'file': {
      const locked = v === '•';
      inp = `<div class="filebox">${v ? `<button type="button" class="btn sm" data-act="file" data-id="${esc(v)}" data-priv="${f.priv ? 1 : 0}" data-name="${esc(f.l)}">${ic(locked ? 'lock' : 'eye')}Berkas tersimpan</button>` : ''}
        ${locked ? '<span class="hint">Anda tidak punya izin mengganti dokumen kependudukan.</span>' : `<input type="file" id="${id}" accept="${f.img ? IMG_ANY : 'application/pdf,' + IMG_ANY + ',.doc,.docx,.xls,.xlsx'}"><span class="hint">${v ? 'Pilih berkas baru untuk mengganti.' : f.img ? 'Foto akan diperkecil otomatis.' : 'PDF atau foto, maks. 25 MB.'}</span>`}</div>`;
      break;
    }
    case 'sdgs': inp = `<div class="checks" id="${id}">${(S.sdgs || []).map(s => `<label title="${esc(s.parameter)}"><input type="checkbox" value="${esc(s.no)}" ${String(v).split(',').indexOf(String(s.no)) >= 0 ? 'checked' : ''}>${esc(s.no)}. ${esc(s.tujuan)}</label>`).join('') || '<span class="hint">Referensi SDGs belum ada.</span>'}</div>`; break;
    case 'person': inp = `<div class="pick"><input id="${id}" value="${esc(v)}" autocomplete="off" data-person="${esc(JSON.stringify(f.fill || {}))}" placeholder="Ketik nama, pilih dari daftar"><div class="pickl" hidden></div></div>`; break;
    case 'refpick': inp = `<div class="btns" style="flex-wrap:nowrap"><input id="${id}" value="${esc(v)}" style="flex:1"><button type="button" class="btn sm" data-act="pick">${ic('list')}Pilih kode</button></div>`; break;
    default: {
      const dl = f.list ? `<datalist id="dl_${f.k}">${f.list.map(o => `<option value="${esc(o)}">`).join('')}</datalist>` : '';
      const sens = f.sens && v.indexOf('•') >= 0;
      inp = `<input id="${id}" type="${f.t === 'email' ? 'email' : f.t === 'tel' ? 'tel' : 'text'}" value="${esc(v)}" ${f.list ? `list="dl_${f.k}"` : ''} ${f.len ? `maxlength="${f.len}" inputmode="numeric"` : ''} ${f.mono ? 'class="mono"' : ''} ${sens ? 'readonly' : ''}>${dl}`;
      if (sens) inp += '<span class="hint">Tersamar. Anda tidak punya izin mengubah NIK/KK.</span>';
      if (f.nikfill && !sens) inp += '<span class="hint" id="nikNote" aria-live="polite"></span>';
    }
  }
  return `<div class="f${wide}">${lab}${inp}${hint}</div>`;
}
function readForm(u, root) {
  const v = {};
  u.fields.forEach(f => {
    const el = $('#f_' + f.k, root);
    if (!el || f.t === 'file') return;
    if (f.t === 'sdgs') v[f.k] = $$('input:checked', el).map(i => i.value).join(',');
    else if (f.t === 'money') v[f.k] = nOnly(el.value);
    else {
      let s = el.value.trim();
      if (f.up) s = s.toUpperCase();
      if (f.pad && /^\d+$/.test(s)) s = s.padStart(f.pad, '0');
      v[f.k] = s;
    }
  });
  return v;
}

    const miss = flds.filter(f => f.req && f.t !== 'file' && !String(val[f.k] || '').trim());
    if (miss.length) { er.textContent = 'Lengkapi: ' + miss.map(f => f.l).join(', ') + '.'; er.hidden = false; $('#f_' + miss[0].k).focus(); return; }
    const bad = u.fields.find(f => f.len && val[f.k] && val[f.k].indexOf('•') < 0 && !new RegExp('^\\d{' + f.len + '}$').test(val[f.k]));
    if (bad) { er.textContent = bad.l + ' harus ' + bad.len + ' digit angka.'; er.hidden = false; return; }
    btn.disabled = true; btn.textContent = 'Menyimpan…';
    try {
      for (const f of u.fields.filter(f => f.t === 'file')) {
        const el = $('#f_' + f.k, frm);
        if (el && el.files && el.files[0]) {
          btn.textContent = 'Mengunggah ' + f.l.toLowerCase() + '…';
          const up = await uploadFile(el.files[0], u.folder || 'Lainnya');
          val[f.k] = up.id;
        }
      }
      if (p.id) val.id = p.id;
      Object.assign(val, p.preset && !p.id ? Object.fromEntries(Object.entries(p.preset).filter(([k]) => !(k in val))) : {});
      if (u.rkp && !val.tahun_rkp) val.tahun_rkp = rec.tahun_rkp || S.rkpYear;
      if (u.sub && !val.ref) val.ref = rec.ref;
      const virt = {}; u.fields.filter(f => f.virt).forEach(f => { if (f.k in val) { virt[f.k] = val[f.k]; delete val[f.k]; } });
      const saved = await call('save', { entity: e, record: val });
      if (e === 'petugas' && !p.id && (virt.kelompok || virt.jabatan)) await call('save', { entity: 'petugas_jabatan', record: Object.assign({ ref: saved.id }, virt) });
      if (/^(aparat|petugas)/.test(e)) S.people = null;
      toast('Tersimpan.');
      back();
      if (e === 'register_surat' && !p.id && suratPath(saved.jenis_surat)) setTimeout(() => cetakSurat(saved), 500);   /* tunggu kembali ke daftar dulu */
    } catch (x) { er.textContent = x.message; er.hidden = false; btn.disabled = false; btn.innerHTML = ic('check') + 'Simpan'; }
  };
};
/* Pilih nama dari data Aparat + Petugas Desa; kolom lain (unsur, tempat/tgl lahir) terisi otomatis */
async function people() {
  if (S.people) return S.people;
  const [ap, pt] = await Promise.all([call('list', { entity: 'aparat', limit: 500 }), call('petugasList', { mode: 'flat', limit: 5000 })]);
  const unsurAp = j => /^kepala desa/i.test(j) ? 'Kepala Desa' : /^sekretaris desa/i.test(j) ? 'Sekretaris Desa' : 'Perangkat Desa';
  S.people = ap.rows.map(x => ({ nama: x.nama, jabatan: x.jabatan || '', unsur: unsurAp(x.jabatan || ''), tempat_lahir: x.tempat_lahir || '', tgl_lahir: x.tgl_lahir || '', asal: 'Aparat' }))
    .concat(pt.rows.map(x => ({ nama: x.nama, jabatan: x.jabatan || '', unsur: x.unsur || x.kelompok || '', tempat_lahir: x.tempat_lahir || '', tgl_lahir: x.tgl_lahir || '', asal: x.kelompok || 'Petugas' })))
    .filter(x => x.nama);
  return S.people;
}
function personPick(frm) {
  people().catch(() => []);
  $$('[data-person]', frm).forEach(inp => {
    const box = inp.nextElementSibling, fill = JSON.parse(inp.dataset.person);
    let list = [], sel = -1;
    const choose = pp => {
      inp.value = pp.nama; box.hidden = true;
      Object.keys(fill).forEach(k => { const el = $('#f_' + k, frm); if (el && pp[fill[k]]) el.value = pp[fill[k]]; });
    };
    const draw = async () => {
      const q = inp.value.trim().toLowerCase();
      const all = await people().catch(() => []);
      list = all.filter(x => !q || (x.nama + ' ' + x.jabatan + ' ' + x.asal).toLowerCase().indexOf(q) >= 0).slice(0, 30);
      sel = -1;
      box.innerHTML = list.map((x, i) => `<button type="button" data-i="${i}">${esc(x.nama)}<small>${esc([x.jabatan, x.asal].filter(Boolean).join(' · '))}${x.tgl_lahir ? ' · lahir ' + esc(fDate(x.tgl_lahir, 1)) : ''}</small></button>`).join('') || '<div class="meta" style="padding:6px 9px">Tidak ada di daftar. Nama tetap bisa diketik manual.</div>';
      box.hidden = document.activeElement !== inp;
    };
    inp.addEventListener('focus', draw);
    inp.addEventListener('input', draw);
    inp.addEventListener('blur', () => setTimeout(() => { box.hidden = true; }, 150));
    inp.addEventListener('keydown', ev => {
      const bs = $$('button', box);
      if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp') { ev.preventDefault(); sel = Math.max(0, Math.min(bs.length - 1, sel + (ev.key === 'ArrowDown' ? 1 : -1))); bs.forEach((b, i) => b.classList.toggle('on', i === sel)); }
      else if (ev.key === 'Enter' && sel >= 0 && list[sel]) { ev.preventDefault(); choose(list[sel]); }
    });
    box.addEventListener('mousedown', ev => { const b = ev.target.closest('[data-i]'); if (b) { ev.preventDefault(); choose(list[+b.dataset.i]); } });
  });
}

VIEWS.pindahberkas = async (p, main) => {
  setTop('Pindahkan foto KTP/KK');
  if (!S.user.admin) { main.innerHTML = '<div class="err">Khusus admin.</div>'; return; }
  main.innerHTML = '<div class="skel" style="height:120px"></div>';
  const J = [['penduduk', 'foto_ktp_id', 'Penduduk/KTP', 'KTP', 'nama'], ['keluarga', 'foto_kk_id', 'Penduduk/KK', 'KK', 'kepala']];
  let todo = [], sudah = 0;
  try {
    for (const [e, k, folder, lbl, nm] of J) {
      const r = await call('list', { entity: e, limit: 5000 });
      r.rows.forEach(x => { const v = x[k]; if (!v || v === '•') return; if (isSbFile(v)) sudah++; else todo.push({ e, k, folder, lbl, id: x.id, fid: v, nama: x[nm] || '' }); });
    }
  } catch (x) { main.innerHTML = `<div class="err">${esc(x.message)}</div>`; return; }
  main.innerHTML = `<div class="card stack"><p style="margin:0">Sudah di penyimpanan baru: <b>${sudah}</b> · Masih di Google Drive: <b id="pbSisa">${todo.length}</b></p>
    <p class="meta" style="margin:0">Biarkan halaman ini terbuka sampai selesai. Salinan di Google Drive tidak dihapus.</p>
    <div class="btns"><button class="btn pri" id="pbGo" ${todo.length ? '' : 'disabled'}>${ic('check')}Mulai pindahkan</button><button class="btn" id="pbStop" hidden>Berhenti</button></div>
    <div class="meta" id="pbLog"></div></div>`;
  let stop = false, ok = 0, gagal = [];
  const log = $('#pbLog'), sisa = $('#pbSisa');
  $('#pbStop').onclick = () => { stop = true; $('#pbStop').disabled = true; };
  $('#pbGo').onclick = async () => {
    $('#pbGo').disabled = true; $('#pbStop').hidden = false;
    const q = todo.slice();
    const kerja = async () => {
      while (q.length && !stop) {
        const t = q.shift();
        try {
          const f = await call('fileData', { id: t.fid });
          if (!f || !f.data) throw new Error('berkas Drive tidak ditemukan');
          const bin = atob(f.data), arr = new Uint8Array(bin.length);
          for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
          const up = await uploadKependudukan(new File([arr], 'x', { type: f.mime || 'image/jpeg' }), t.folder);
          await call('save', { entity: t.e, record: { id: t.id, [t.k]: up.id } });
          ok++;
        } catch (x) { gagal.push(t.lbl + ' ' + t.nama + ': ' + x.message); }
        sisa.textContent = todo.length - ok;
        log.innerHTML = `Berhasil ${ok} · Gagal ${gagal.length}${gagal.length ? '<br>' + gagal.slice(-8).map(esc).join('<br>') : ''}`;
      }
    };
    await Promise.all([kerja(), kerja(), kerja()]);
    $('#pbStop').hidden = true;
    toast(stop ? 'Dihentikan. Berhasil ' + ok + '.' : 'Selesai. Berhasil ' + ok + ', gagal ' + gagal.length + '.', gagal.length > 0);
  };
};

const TITIK = '..........................';
const dPanjang = v => { const d = parseD(v); return d ? pad2(d.getDate()) + ' ' + BULAN[d.getMonth()] + ' ' + d.getFullYear() : String(v || ''); };
const dDmy = (v, sep) => { const d = parseD(v); sep = sep || '/'; return d ? pad2(d.getDate()) + sep + pad2(d.getMonth() + 1) + sep + d.getFullYear() : String(v || ''); };
const dHari = v => { const d = parseD(v); return d ? HARI[d.getDay()] : ''; };
const dJam = v => { const p = String(v || '').split(/[.:]/); return p.length >= 2 ? pad2(p[0]) + ':' + pad2(p[1]) : String(v || ''); };
const dRupiah = v => { const n = Number(String(v == null ? '' : v).replace(/[^\d-]/g, '')); return !n ? '-' : n.toLocaleString('id-ID') + ',-'; };
const judulKata = s => String(s || '').toLowerCase().replace(/(^|[\s.,'/(-])([a-z])/g, (m, a, b) => a + b.toUpperCase());
function tambahU(M) { Object.keys(M).forEach(k => { if (!/_U$/.test(k)) M[k + '_U'] = String(M[k]).toUpperCase(); }); return M; }

async function tplDaftar(force) {
  if (!force && S.tplStore) return S.tplStore;
  S.tplStore = await callBerkas('tplList');
  return S.tplStore;
}
async function tplAmbil(path) {
  const r = await callBerkas('tplGet', { path });
  const res = await fetch(r.url).catch(() => null);
  if (!res || !res.ok) throw new Error('Template "' + path.split('/').pop() + '" belum ada atau gagal diunduh.');
  return res.arrayBuffer();
}
async function tplSimpan(path, blob) {
  const r = await callBerkas('tplUp', { path });
  const up = await fetch(r.url, { method: 'PUT', headers: { 'Content-Type': blob.type || 'application/vnd.openxmlformats-officedocument.wordprocessingml.document', 'x-upsert': 'true' }, body: blob }).catch(() => null);
  if (!up || !up.ok) throw new Error('Gagal mengunggah template' + (up ? ' (' + up.status + ')' : '') + '.');
  S.tplStore = null;
}
function blobB64(blob) { return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.onerror = () => rej(new Error('Gagal membaca dokumen.')); r.readAsDataURL(blob); }); }
function b64Blob(b64, type) { const bin = atob(b64), a = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i); return new Blob([a], { type }); }
const namaFile = s => String(s || 'Dokumen').replace(/[\\/:*?"<>|]+/g, '_').replace(/\s+/g, ' ').trim().slice(0, 140);

/**
 * Isi template → unduh Word → buat PDF di latar belakang.
 * o: { path, M, rows, nama, jenis ('rkp'|'surat'|'kk'), onPdf(pdf) }
 */
async function buatDokumen(o) {
  const buf = await tplAmbil(o.path);
  const xlsx = /\.xlsx$/i.test(o.path);
  const { blob, missing } = await DOCX.fill(buf, o.M, o.rows, xlsx);
  const nama = namaFile(o.nama) + (xlsx ? '.xlsx' : '.docx');
  saveBlob(blob, nama);
  let pdfP = null;
  if (!xlsx && o.jenis) {
    pdfP = blobB64(blob).then(data => call('toPdf', { name: nama, data, jenis: o.jenis }))
      .then(async p => { if (o.onPdf) await o.onPdf(p); return p; });
  }
  return { nama, missing, pdf: pdfP };
}
function hasilDokumen(m, r, pdfNote) {

    ${r.missing && r.missing.length ? `<div class="meta">Tanda yang belum ada datanya (dikosongkan): ${esc(r.missing.slice(0, 15).join(', '))}${r.missing.length > 15 ? ', …' : ''}</div>` : ''}
    <div id="pdfSt" class="meta">${r.pdf ? 'Membuat PDF di Google Drive… (boleh ditutup, proses tetap berjalan)' : ''}</div></div>`;
  if (r.pdf) r.pdf.then(p => { const el = $('#pdfSt', m.el); if (el) el.innerHTML = `${ic('check')} PDF tersimpan${pdfNote ? ' ' + esc(pdfNote) : ''}. ${p.url && !/Penduduk|Pelayanan/.test(pdfNote || '') ? `<a href="${esc(p.url)}" target="_blank" rel="noopener">Buka PDF</a>` : ''}`; })
    .catch(x => { const el = $('#pdfSt', m.el); if (el) el.innerHTML = `<span class="err">PDF gagal dibuat: ${esc(x.message)}</span>`; else toast('PDF gagal dibuat: ' + x.message, 1); });
}

  put('Wakil Masyarakat', mu.wakil_masyarakat);
  put('Tgl SK', dPanjang(mu.tgl_sk)); put('Nomor SK Tim Penyusun', mu.no_sk_penyusun); put('Nomor SK Tim Verifikasi', mu.no_sk_verifikasi);

  const ttl = x => x ? [x.tempat_lahir, dPanjang(x.tgl_lahir)].filter(String).join(', ') : TITIK;
  const tp = (d.tim || []).filter(x => x.jenis_tim === 'Tim Penyusun'), tv = (d.tim || []).filter(x => x.jenis_tim === 'Tim Verifikasi');
  for (let i = 0; i < 11; i++) { const x = tp[i]; put('TP' + (i + 1), x ? x.nama : TITIK); put('JabatanTP' + (i + 1), x ? x.jabatan_tim : TITIK); put('TLTP' + (i + 1), ttl(x)); put('UNTP' + (i + 1), x ? x.unsur : TITIK); }
  for (let i = 0; i < 5; i++) { const x = tv[i]; put('TV' + (i + 1), x ? x.nama : TITIK); put('JabatanTV' + (i + 1), x ? x.jabatan_tim : TITIK); put('TLTV' + (i + 1), ttl(x)); put('UNTV' + (i + 1), x ? x.unsur : TITIK); put('UnsurTV' + (i + 1), x ? x.unsur : TITIK); }
  const jd = d.jadwal || [];

function barisRkp(d) {
  const rows = [{
    key: 'RDH_Aktif', items: (d.hukum || []).map(x => ({ RDH_Aktif: x.rincian || '' })), empty: { RDH_Aktif: TITIK },
    fn: (tr, it, n, first, col, setCell) => {
      const cells = Array.from(tr.childNodes).filter(c => c.localName === 'tc');
      cells.forEach((c, i) => { if (i === col - 1) setCell(c, n + '.'); else if (!first && i < col - 1) setCell(c, ''); });
    }
  }];
  const kol = ['c', 'd', 'e', 'f', 'g', 'h', 'i', 'j', 'k'];
  for (let b = 1; b <= 5; b++) {
    const items = (d.usulan || []).filter(x => ('0' + String(x.kode_bidang || '').replace(/\D/g, '')).slice(-2) === pad2(b)).map((x, i) => {
      const v = { c: (i + 1) + '.', d: x.kegiatan, e: [x.sumber_dana, x.kementerian].filter(Boolean).join(' / '), f: x.sdgs, g: x.tahun_pelaksanaan, h: [x.lokasi, x.dusun, x.rt && 'RT ' + x.rt, x.rw && 'RW ' + x.rw].filter(Boolean).join(', '), i: x.volume, j: x.satuan, k: dRupiah(x.total) };
      const o = {}; kol.forEach(p => { o[p + b] = v[p] || ''; }); return o;
    });
    const empty = {}; kol.forEach(p => { empty[p + b] = ''; });
    rows.push({ key: 'c' + b, items, empty });
  }
  return rows;
}

    <div class="card meta" style="line-height:1.7">${['Desa', 'Kecamatan', 'Kabupaten', 'Alamat Desa', 'Kode Pos', 'Kode Desa', 'No', 'Tahun', 'Tanggal Surat', 'Nama', 'NIK', 'No KK', 'TTL', 'Tempat Lahir', 'Tanggal Lahir', 'Umur', 'Jenis Kelamin', 'Agama', 'Pekerjaan', 'Status Perkawinan', 'Kewarganegaraan', 'Pendidikan', 'Alamat', 'Dusun', 'RT', 'RW', 'Keperluan', 'Kepala Desa', 'Alamat Domisili', 'Lama Tinggal', 'Nama Usaha', 'Jenis Usaha', 'Alamat Usaha', 'Mulai Usaha', 'Nama Bayi', 'JK Bayi', 'Hari Lahir Bayi', 'Tanggal Lahir Bayi', 'Jam Lahir', 'Tempat Lahir Bayi', 'Anak Ke', 'Nama Ayah', 'Nama Ibu', 'Hari Meninggal', 'Tanggal Meninggal', 'Jam Meninggal', 'Tempat Meninggal', 'Sebab Meninggal', 'Pelapor', 'Alamat Tujuan', 'Alasan Pindah', 'Jumlah Pengikut', 'Penghasilan', 'Penghasilan Terbilang'].map(k => `<span class="mono">{{${esc(k)}}}</span>`).join(' · ')}</div>
    <input type="file" id="tplFile" accept=".docx,.xlsx" hidden></div>`;
  void ada;
  let target = '';
  const fin = $('#tplFile');
  fin.onchange = async () => {
    const f = fin.files[0]; fin.value = ''; if (!f) return;
    if (!/\.(docx|xlsx)$/i.test(f.name)) return toast('Pilih file Word (.docx).', 1);
    let path = target;
    if (path === 'rkp/') path = 'rkp/' + f.name.replace(/[^\w\-. ()]+/g, '_');
    if (/\.xlsx$/i.test(f.name) !== /\.xlsx$/i.test(path)) return toast('Jenis file harus sama dengan template yang diganti (.docx).', 1);
    try { await DOCX.unzip(await f.arrayBuffer()); await tplSimpan(path, f); toast('Template disimpan.'); refresh(); } catch (x) { toast(x.message, 1); }
  };
  S.vh.tplUpBtn = t => { target = t.dataset.p; fin.click(); };
  S.vh.tplDl = async t => { try { const b = await tplAmbil(t.dataset.p); saveBlob(new Blob([b]), t.dataset.p.split('/').pop()); } catch (x) { toast(x.message, 1); } };
  S.vh.tplTags = async t => { try { const tg = await DOCX.tags(await tplAmbil(t.dataset.p)); modal('Tanda di template', tg.length ? `<div class="meta" style="line-height:1.8">${tg.map(k => `<span class="mono">{{${esc(k)}}}</span>`).join(' · ')}</div>` : '<div class="meta">Tidak ada tanda {{…}}.</div>'); } catch (x) { toast(x.message, 1); } };
  S.vh.tplDelBtn = t => confirmDel(t.parentNode, async () => { await callBerkas('tplDel', { path: t.dataset.p }); S.tplStore = null; toast('Template dihapus.'); refresh(); });
  S.vh.tplImpor = async () => {
    const m = modal('Ambil template dari Google Drive', '<div class="skel"></div>');
    try {
      const src = await call('tplSources');
      m.body.innerHTML = `<div class="stack"><div class="meta">Template Google Docs lama diubah menjadi Word lalu disimpan di penyimpanan template. File di Drive tidak diubah.</div><div id="impLog" class="meta">${src.map(s => esc(s.name)).join('<br>')}</div><button class="btn pri" id="impGo">${ic('check')}Ambil ${src.length} template</button></div>`;
      $('#impGo', m.el).onclick = async () => {
        $('#impGo', m.el).disabled = true; const log = []; const L = $('#impLog', m.el);
        for (const s of src) {
          try {
            const r = await call('tplExport', { id: s.id });
            const path = s.jenis === 'kk' ? 'kk/draf_kk.docx' : 'rkp/' + s.name.replace(/[^\w\-. ()]+/g, '_') + '.docx';
            await tplSimpan(path, b64Blob(r.data, 'application/vnd.openxmlformats-officedocument.wordprocessingml.document'));
            log.push('✓ ' + esc(s.name));
          } catch (x) { log.push('✗ ' + esc(s.name) + ': ' + esc(x.message)); }
          L.innerHTML = log.join('<br>');
        }
        toast('Selesai mengambil template.'); refresh();
      };
    } catch (x) { m.body.innerHTML = `<div class="err">${esc(x.message)}</div>`; }
  };
};

function kop() {
  const s = S.set;
  return `<div class="kop">${s.logo_url ? `<img src="${esc(s.logo_url)}" alt="">` : ''}<div><b>PEMERINTAH KABUPATEN ${esc(String(s.kabupaten || '').toUpperCase())}</b><b>KECAMATAN ${esc(String(s.kecamatan || '').toUpperCase())}</b><b class="big">DESA ${esc(String(s.nama_desa || '').toUpperCase())}</b><small>${esc(s.alamat || '')} ${s.kode_pos ? 'Kode Pos ' + esc(s.kode_pos) : ''}${s.email_desa ? ' · Email: ' + esc(s.email_desa) : ''}</small></div>${s.logo_url ? '<span style="width:70px"></span>' : ''}</div>`;
}
function ttdKades(tgl, extra) {
  const s = S.set;
  return `<div class="ttd"><div></div><div>${esc(s.nama_desa || '')}, ${tgl ? fDate(tgl) : '..............................'}<br>${extra || 'KEPALA DESA ' + esc(String(s.nama_desa || '').toUpperCase())}<div class="sp"></div><u>${esc(s.nama_kades || '..............................')}</u></div></div>`;
}
function cell(c, r) { return typeof c[1] === 'function' ? c[1](r) : esc(r[c[1]]); }
function docRegister(cfg, rows, per) {
  return `<div class="paper ${cfg.land ? 'land' : ''}">${cfg.form ? `<div style="text-align:right;font-size:10pt">${esc(cfg.form)}</div>` : ''}<h2>${esc(cfg.title)}</h2><h3>DESA ${esc(String(S.set.nama_desa || '').toUpperCase())}${per ? ' — ' + esc(String(per).toUpperCase()) : ''}</h3>
    <table class="pt"><thead><tr><th>No</th>${cfg.cols.map(c => `<th>${esc(c[0])}</th>`).join('')}</tr></thead><tbody>${rows.map((r, i) => `<tr><td style="text-align:center">${i + 1}</td>${cfg.cols.map(c => `<td>${cell(c, r) || ''}</td>`).join('')}</tr>`).join('') || `<tr><td colspan="${cfg.cols.length + 1}" style="text-align:center">Tidak ada data</td></tr>`}</tbody>

}

}
async function rkpDoc(kind, mu) {
  const y = S.rkpYear;
  const listAll = (entity, extra) => call('list', Object.assign({ entity, limit: 5000, filters: { tahun_rkp: y } }, extra || {})).then(r => r.rows);
  if (kind === 'rktl') return printDocs('Form 03', [docRktl(await listAll('rkp_jadwal', { sort: 'tanggal', desc: false }))]);
  if (kind === 'f4') return printDocs('Form 04', [docRegister(UI.rkp_usulan.print, await listAll('rkp_usulan', { sort: 'kode_kegiatan', desc: false }), 'RKP Desa Tahun ' + y)]);
  if (kind === 'f5') return printDocs('Form 05', [docRegister(UI.rkp_pembiayaan.print, await listAll('rkp_pembiayaan', { sort: 'kode_bidang', desc: false }), 'RKP Desa Tahun ' + y)]);
  if (!mu) {
    const ms = (await listAll('rkp_musyawarah')).filter(x => /Pembentukan/i.test(x.musyawarah));
    if (!ms.length) throw new Error('Belum ada data "Musdes Pembentukan Tim RKP Desa" untuk tahun ' + y + '. Isi dulu di Form 01–02.');
    mu = ms[0];
  }
  const [tim, nara, hk] = await Promise.all([
    call('list', { entity: 'rkp_tim', filters: { ref: mu.id }, limit: 200, sort: 'urut', desc: false }).then(r => r.rows),
    call('list', { entity: 'rkp_narasumber', filters: { ref: mu.id }, limit: 100 }).then(r => r.rows),
    call('list', { entity: 'ref_hukum', limit: 200, sort: 'no', desc: false }).then(r => r.rows.filter(x => x.status !== 'Tidak Aktif'))
  ]);
  if (kind === 'ba') return printDocs('Berita Acara', [docBA(mu, tim, nara)]);
  if (kind === 'skp') return printDocs('SK Tim Penyusun', docSK(mu, tim.filter(x => x.jenis_tim === 'Tim Penyusun'), hk, 'penyusun'));
  if (kind === 'skv') return printDocs('SK Tim Verifikasi', docSK(mu, tim.filter(x => x.jenis_tim === 'Tim Verifikasi'), hk, 'verifikasi'));
}
function docBA(mu, tim, nara) {
  const d = parseD(mu.tanggal) || new Date();
  const s = S.set, y = mu.tahun_rkp;
  const tp = tim.filter(x => x.jenis_tim === 'Tim Penyusun');
  return `<div class="paper">${kop()}<div style="text-align:right;font-size:10pt">Form 01</div><h2>BERITA ACARA</h2><h3 style="text-transform:uppercase">MUSYAWARAH DESA TENTANG PEMBENTUKAN TIM PENYUSUN RENCANA KERJA PEMERINTAH DESA TAHUN ${esc(y)}</h3>
  <p>Pada hari ini ${HARI[d.getDay()]} tanggal ${terbilang(d.getDate())} bulan ${BULAN[d.getMonth()]} tahun ${terbilang(d.getFullYear())} (${fDate(mu.tanggal)}), pukul ${esc(String(mu.jam || '').slice(0, 5))} WIB, bertempat di ${esc(mu.tempat)}, telah diselenggarakan ${esc(mu.musyawarah)} yang dihadiri oleh unsur Pemerintah Desa, Badan Permusyawaratan Desa, dan unsur masyarakat sebagaimana daftar hadir terlampir.</p>

  <div class="dict" style="margin-left:22px"><span>Nama</span><span>:</span><span>${esc(mu.notulen)}</span><span>Unsur</span><span>:</span><span>${esc(mu.unsur_notulen)}</span></div>
  ${nara.length ? `<p>Narasumber musyawarah:</p><ol>${nara.map(n => `<li>${esc(n.nama)} (${esc(n.unsur)})</li>`).join('')}</ol>` : ''}
  <p>Materi musyawarah adalah pembentukan Tim Penyusun Rencana Kerja Pemerintah Desa Tahun ${esc(y)}. Setelah dilakukan pembahasan, peserta musyawarah menyepakati susunan Tim Penyusun RKP Desa sebagai berikut:</p>
  <table class="pt"><thead><tr><th>No</th><th>Nama</th><th>Jabatan dalam Tim</th><th>Unsur</th></tr></thead><tbody>${tp.map((r, i) => `<tr><td style="text-align:center">${i + 1}</td><td>${esc(r.nama)}</td><td>${esc(r.jabatan_tim)}</td><td>${esc(r.unsur)}</td></tr>`).join('') || '<tr><td colspan="4" style="text-align:center">Belum diisi</td></tr>'}</tbody></table>
  ${mu.catatan ? `<p>Catatan: ${esc(mu.catatan)}</p>` : ''}
  <p>Demikian Berita Acara ini dibuat dengan sebenarnya untuk dapat dipergunakan sebagaimana mestinya.</p>
  <div class="ttd"><div>Pimpinan Musyawarah<br>${esc(mu.unsur_pimpinan)}<div class="sp"></div><u>${esc(mu.pimpinan)}</u></div><div>Notulen<br>${esc(mu.unsur_notulen)}<div class="sp"></div><u>${esc(mu.notulen)}</u></div></div>
  <div class="ttd"><div>Mengetahui,<br>Kepala Desa ${esc(s.nama_desa)}<div class="sp"></div><u>${esc(s.nama_kades || '..............................')}</u></div><div>Wakil Masyarakat<br>&nbsp;<div class="sp"></div><u>${esc(mu.wakil_masyarakat || '..............................')}</u></div></div></div>`;
}
function docSK(mu, tim, hk, jenis) {
  const s = S.set, y = mu.tahun_rkp;
  const judul = jenis === 'penyusun' ? 'PEMBENTUKAN TIM PENYUSUN RENCANA KERJA PEMERINTAH DESA TAHUN ' + y : 'PEMBENTUKAN TIM VERIFIKASI RENCANA KERJA PEMERINTAH DESA TAHUN ' + y;

    ? ['Mencermati pagu indikatif desa dan penyelarasan program/kegiatan masuk ke desa;', 'Mencermati ulang dokumen RPJM Desa;', 'Menyusun rancangan RKP Desa; dan', 'Menyusun rancangan Daftar Usulan RKP Desa.']
    : ['Melakukan verifikasi terhadap rancangan RKP Desa, meliputi kesesuaian dengan RPJM Desa dan kewenangan desa;', 'Memeriksa kelayakan rancangan kegiatan dan Rencana Anggaran Biaya; dan', 'Menyampaikan hasil verifikasi kepada Tim Penyusun RKP Desa.'];
  const nk = String(s.nama_desa || '').toUpperCase();

  <table class="kv"><tr><td style="width:110px">Menimbang</td><td>:</td><td><ol type="a" style="margin:0"><li>bahwa dalam rangka penyusunan Rencana Kerja Pemerintah Desa Tahun ${esc(y)} perlu dibentuk ${jenis === 'penyusun' ? 'Tim Penyusun' : 'Tim Verifikasi'} RKP Desa;</li><li>bahwa berdasarkan hasil Musyawarah Desa tanggal ${fDate(mu.tanggal)}, perlu menetapkan Keputusan Kepala Desa tentang ${esc(judul.toLowerCase().replace(/(^|\s)\S/g, t => t.toUpperCase()))};</li></ol></td></tr>
  <tr><td>Mengingat</td><td>:</td><td><ol style="margin:0">${hk.map(h => `<li>${esc(h.rincian)};</li>`).join('') || '<li>..............................</li>'}</ol></td></tr></table>
  <h3 style="margin-top:12px">MEMUTUSKAN:</h3>
  <table class="kv"><tr><td style="width:110px">Menetapkan</td><td>:</td><td><b>KEPUTUSAN KEPALA DESA TENTANG ${esc(judul)}.</b></td></tr>
  <tr><td>KESATU</td><td>:</td><td>Membentuk ${jenis === 'penyusun' ? 'Tim Penyusun' : 'Tim Verifikasi'} Rencana Kerja Pemerintah Desa Tahun ${esc(y)} dengan susunan sebagaimana tercantum dalam Lampiran yang merupakan bagian tidak terpisahkan dari Keputusan ini.</td></tr>
  <tr><td>KEDUA</td><td>:</td><td>Tim sebagaimana dimaksud Diktum KESATU mempunyai tugas:<ol type="a" style="margin:2px 0">${tugas.map(t => `<li>${esc(t)}</li>`).join('')}</ol></td></tr>
  <tr><td>KETIGA</td><td>:</td><td>Segala biaya yang timbul akibat ditetapkannya Keputusan ini dibebankan pada Anggaran Pendapatan dan Belanja Desa ${esc(s.nama_desa)} Tahun Anggaran ${Number(y) - 1}.</td></tr>
  <tr><td>KEEMPAT</td><td>:</td><td>Keputusan ini mulai berlaku pada tanggal ditetapkan.</td></tr></table>
  <div class="ttd"><div></div><div>Ditetapkan di ${esc(s.nama_desa)}<br>pada tanggal ${mu.tgl_sk ? fDate(mu.tgl_sk) : '..............................'}<br>KEPALA DESA ${esc(nk)}<div class="sp"></div><u>${esc(s.nama_kades || '..............................')}</u></div></div></div>`;
  const p2 = `<div class="paper"><table class="kv" style="margin-left:auto;font-size:10.5pt"><tr><td>LAMPIRAN</td><td>:</td><td>KEPUTUSAN KEPALA DESA ${esc(nk)}</td></tr><tr><td>NOMOR</td><td>:</td><td>${esc(nomor || '')}</td></tr><tr><td>TANGGAL</td><td>:</td><td>${mu.tgl_sk ? fDate(mu.tgl_sk) : ''}</td></tr></table>
  <h2 style="margin-top:16px">SUSUNAN ${jenis === 'penyusun' ? 'TIM PENYUSUN' : 'TIM VERIFIKASI'} RKP DESA TAHUN ${esc(y)}</h2>
  <table class="pt"><thead><tr><th>No</th><th>Nama</th><th>Tempat, Tgl Lahir</th><th>Jabatan dalam Tim</th><th>Unsur</th></tr></thead><tbody>${tim.map((r, i) => `<tr><td style="text-align:center">${i + 1}</td><td>${esc(r.nama)}</td><td>${esc(r.tempat_lahir || '')}${r.tgl_lahir ? ', ' + fDate(r.tgl_lahir) : ''}</td><td>${esc(r.jabatan_tim)}</td><td>${esc(r.unsur)}</td></tr>`).join('') || '<tr><td colspan="5" style="text-align:center">Belum diisi</td></tr>'}</tbody></table>
  <div class="ttd"><div></div><div>KEPALA DESA ${esc(nk)}<div class="sp"></div><u>${esc(s.nama_kades || '..............................')}</u></div></div></div>`;
  return [p1, p2];
}
function docRktl(rows) {
  const y = S.rkpYear;

  <table class="pt"><thead><tr><th>No</th><th>Hari, Tanggal</th><th>Pukul</th><th>Tempat</th><th>Uraian Kegiatan</th><th>Keterangan</th><th>Keluaran</th></tr></thead>
  <tbody>${rows.map(r => `<tr><td>${esc(r.no)}</td><td>${fDay(r.tanggal)}</td><td>${esc(String(r.jam || '').slice(0, 5))}${r.sampai ? ' s/d ' + esc(r.sampai) : ''}</td><td>${esc(r.tempat)}</td><td style="white-space:pre-wrap">${esc(r.uraian)}</td><td style="white-space:pre-wrap">${esc(r.keterangan)}</td><td style="white-space:pre-wrap">${esc(r.keluaran)}</td></tr>`).join('') || '<tr><td colspan="7" style="text-align:center">Belum ada jadwal</td></tr>'}</tbody></table>${ttdKades(isoToday(), 'KEPALA DESA ' + esc(String(S.set.nama_desa || '').toUpperCase()) + '<br>selaku Pembina Tim Penyusun')}</div>`;
}
function printDocs(title, pages) {
  const html = pages.join('');
  const m = modal(title, `<div class="stack"><div class="btns"><button class="btn pri" id="doPrint">${ic('print')}Cetak / simpan PDF</button></div><div class="meta">Pilih "Simpan sebagai PDF" di jendela cetak untuk menyimpan berkas.</div><div class="doc-prev">${html}</div></div>`, { big: 1 });
  const fit = () => { const box = $('.doc-prev', m.el); if (!box) return; $$('.paper', box).forEach(pp => { pp.style.zoom = 1; const w = pp.getBoundingClientRect().width; const avail = box.clientWidth - 24; pp.style.zoom = w > avail ? (avail / w).toFixed(3) : 1; }); };
  requestAnimationFrame(fit);
  $('#doPrint', m.el).onclick = () => {
    $('#printArea').innerHTML = html;
    const land = pages.some(p => /paper land/.test(p));
    let st = $('#pgsz'); if (!st) { st = document.createElement('style'); st.id = 'pgsz'; document.head.appendChild(st); }
    st.textContent = '@media print{@page{size:A4 ' + (land ? 'landscape' : 'portrait') + ';margin:0}}';
    setTimeout(() => window.print(), 50);
  };
}
