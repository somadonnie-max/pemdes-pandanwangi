<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f5a46">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pemdes PW">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f5a46'/%3E%3Ctext x='32' y='41' font-family='Arial' font-weight='700' font-size='24' fill='white' text-anchor='middle'%3EPW%3C/text%3E%3C/svg%3E">
<title>Pemdes Pandanwangi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#eff3f1; --surface:#ffffff; --surface2:#e5ece8; --ink:#14201b; --muted:#5a6a63; --line:#d3ddd8;
  --pri:#0f5a46; --pri-2:#0b4838; --pri-ink:#ffffff; --pri-soft:#d9ebe3;
  --gold:#b87d0e; --gold-soft:#f7ebcf;
  --ok:#1d7a48; --ok-soft:#dcf0e4; --warn:#9a6508; --warn-soft:#faecd0; --bad:#b3261e; --bad-soft:#f9dedb; --info:#1d5f9e; --info-soft:#dde9f6;
  --shadow:0 1px 2px rgba(15,40,30,.06),0 6px 20px rgba(15,40,30,.06);
  --r:14px; --font:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0d1512; --surface:#15201c; --surface2:#1c2a25; --ink:#e4ede9; --muted:#97a8a0; --line:#2a3933;
    --pri:#58c39b; --pri-2:#3fa983; --pri-ink:#062519; --pri-soft:#163a2e;
    --gold:#e4b24a; --gold-soft:#3a2d12;
    --ok:#5cc98b; --ok-soft:#173a28; --warn:#e3ad4c; --warn-soft:#3b2d12; --bad:#f0827a; --bad-soft:#442320; --info:#7fb1e6; --info-soft:#1b2d42;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0d1512; --surface:#15201c; --surface2:#1c2a25; --ink:#e4ede9; --muted:#97a8a0; --line:#2a3933;
  --pri:#58c39b; --pri-2:#3fa983; --pri-ink:#062519; --pri-soft:#163a2e;
  --gold:#e4b24a; --gold-soft:#3a2d12;
  --ok:#5cc98b; --ok-soft:#173a28; --warn:#e3ad4c; --warn-soft:#3b2d12; --bad:#f0827a; --bad-soft:#442320; --info:#7fb1e6; --info-soft:#1b2d42;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--pri)}
h1,h2,h3{margin:0;line-height:1.25;text-wrap:balance}
.mono{font-family:var(--mono);font-size:.86em;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.ic{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:2.5px solid var(--gold);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- shell ---------- */
.app{min-height:100%;display:flex}
.side{display:none}
.shell{flex:1;min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--pri);color:var(--pri-ink);display:flex;align-items:center;gap:10px;padding:10px 16px;min-height:56px}
.top .title{flex:1;min-width:0;font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sub{display:block;font-weight:500;font-size:12px;opacity:.8}
.iconbtn{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:12px;border:0;background:transparent;color:inherit;cursor:pointer}
.iconbtn:hover{background:rgba(255,255,255,.12)}
main{flex:1;width:100%;max-width:1080px;margin:0 auto;padding:16px 16px 96px}
.demo{background:var(--gold-soft);color:var(--ink);font-size:13px;padding:8px 16px;text-align:center;border-bottom:1px solid var(--line)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{flex:1;border:0;background:none;padding:8px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:600;color:var(--muted);cursor:pointer}
.tabs button.on{color:var(--pri)}
.tabs .ic{width:22px;height:22px}
@media (min-width:900px){
  .side{display:flex;flex-direction:column;width:260px;flex:none;position:sticky;top:0;height:100vh;overflow:auto;background:var(--surface);border-right:1px solid var(--line);padding:16px 12px}
  .tabs{display:none}
  main{padding-bottom:40px}
  .top .menu-btn{display:none}
}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 16px}
.seal{width:40px;height:40px;border-radius:12px;background:var(--pri);color:var(--pri-ink);display:grid;place-items:center;font-weight:800;font-size:15px;letter-spacing:.02em;flex:none}
.seal img{width:100%;height:100%;object-fit:contain;border-radius:12px;background:#fff}
.brand b{display:block;font-size:15px}
.brand span{font-size:12px;color:var(--muted)}
.nav-h{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:14px 10px 4px}
.nav-i{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;text-align:left;padding:8px 10px;border-radius:10px;cursor:pointer;font-size:14px;color:var(--ink)}
.nav-i:hover{background:var(--surface2)}
.nav-i.on{background:var(--pri-soft);color:var(--pri);font-weight:600}
.nav-i .ic{width:18px;height:18px;color:var(--muted)}
.nav-i.on .ic{color:var(--pri)}

/* ---------- blocks ---------- */
.stack{display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:8px 2px 0}
.sec-h h2{font-size:13px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.tile{display:flex;flex-direction:column;gap:10px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px;cursor:pointer;min-height:104px;transition:border-color .15s,transform .15s}
.tile:hover{border-color:var(--pri);transform:translateY(-1px)}
.tile .ti{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--pri-soft);color:var(--pri)}
.tile b{font-size:14px;font-weight:600;line-height:1.3}
.tile small{color:var(--muted);font-size:12px;margin-top:-6px}
.tile.soon .ti{background:var(--surface2);color:var(--muted)}
.tile .cnt{font-family:var(--mono);font-size:12px;color:var(--muted);margin-left:auto}
.tile-row{display:flex;width:100%;align-items:center}

.hero{background:var(--pri);color:var(--pri-ink);border-radius:18px;padding:18px;display:grid;gap:14px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:50%;border:26px solid rgba(255,255,255,.07)}
.hero .hi{font-size:13px;opacity:.85}
.hero h1{font-size:21px;font-weight:800}
.clock{font-family:var(--mono);font-size:40px;font-weight:500;letter-spacing:-.03em;line-height:1}
.hero .hrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;position:relative;z-index:1}
.hero .btn{background:var(--pri-ink);color:var(--pri);border-color:transparent}
.hero .ghost{background:rgba(255,255,255,.12);color:var(--pri-ink);border-color:rgba(255,255,255,.25)}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.stat b{display:block;font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--muted)}

.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.info{background:var(--info-soft);color:var(--info)}
.pill.pri{background:var(--pri-soft);color:var(--pri)} .pill.gold{background:var(--gold-soft);color:var(--gold)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:11px;padding:9px 14px;font-weight:600;font-size:14px;cursor:pointer;min-height:42px;text-decoration:none}
.btn:hover{border-color:var(--pri)}
.btn.pri{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}
.btn.pri:hover{background:var(--pri-2)}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.danger.solid{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.sm{min-height:34px;padding:6px 11px;font-size:13px}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.fab{position:fixed;right:18px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:25;border-radius:16px;min-height:52px;padding:0 18px;box-shadow:var(--shadow)}
@media (min-width:900px){.fab{bottom:28px;right:28px}}

/* ---------- list ---------- */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.search{flex:1 1 220px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px;min-height:44px}
.search input{border:0;background:none;outline:0;flex:1;min-width:0;padding:10px 0}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;white-space:nowrap;cursor:pointer;color:var(--muted)}
.chip.on{background:var(--pri);border-color:var(--pri);color:var(--pri-ink)}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:0;border-top:1px solid var(--line);background:none;text-align:left;cursor:pointer;width:100%}
.row:first-child{border-top:0}
.row:hover{background:var(--surface2)}
.row .main{flex:1;min-width:0}
.row .t{font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row .s{font-size:13px;color:var(--muted);margin-top:2px;overflow-wrap:anywhere}
.row .r{text-align:right;flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-size:12.5px;color:var(--muted)}
.av{width:40px;height:40px;border-radius:12px;background:var(--pri-soft);color:var(--pri);display:grid;place-items:center;font-weight:700;font-size:14px;flex:none;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.empty{padding:36px 16px;text-align:center;color:var(--muted)}
.empty .ic{width:36px;height:36px;margin:0 auto 8px;display:block;opacity:.6}
.meta{font-size:12.5px;color:var(--muted)}

/* ---------- detail ---------- */
.dl{display:grid;grid-template-columns:minmax(120px,32%) 1fr;gap:0;border-top:1px solid var(--line)}
.dl dt,.dl dd{margin:0;padding:10px 0;border-bottom:1px solid var(--line)}
.dl dt{color:var(--muted);font-size:13px;padding-right:12px}
.dl dd{white-space:pre-wrap;overflow-wrap:anywhere}
@media (max-width:520px){.dl{grid-template-columns:1fr}.dl dt{border-bottom:0;padding-bottom:0}.dl dd{padding-top:2px}}
.d-head{display:flex;gap:14px;align-items:flex-start}
.d-head h1{font-size:19px}
.photo{width:72px;height:72px;border-radius:16px;object-fit:cover;background:var(--surface2)}

/* ---------- form ---------- */
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.f{display:flex;flex-direction:column;gap:6px;min-width:0}
.f.wide{grid-column:1/-1}
@media (max-width:640px){.form{grid-template-columns:1fr}}
.f label,.lbl{font-size:13px;font-weight:600;color:var(--muted)}
.f label i{color:var(--bad);font-style:normal}
.inp,.f input:not([type=checkbox]):not([type=radio]):not([type=file]),.f select,.f textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:10px 12px;min-height:44px;outline:0}
.f textarea{min-height:88px;resize:vertical}
.inp:focus,.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-soft)}
.hint{font-size:12px;color:var(--muted)}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:13px;font-weight:500;color:var(--ink);cursor:pointer;background:var(--surface)}
.checks input{accent-color:var(--pri)}
.checks label:has(input:checked){border-color:var(--pri);background:var(--pri-soft)}
.filebox{display:flex;flex-wrap:wrap;gap:8px;align-items:center;border:1px dashed var(--line);border-radius:11px;padding:10px}
.switch{display:flex;align-items:center;gap:10px;font-weight:500}
.switch input{width:20px;height:20px;accent-color:var(--pri)}
.err{background:var(--bad-soft);color:var(--bad);border-radius:11px;padding:10px 12px;font-size:14px}

/* ---------- login ---------- */
.login{min-height:100%;min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--pri)}
.login-card{width:100%;max-width:440px;background:var(--surface);border-radius:22px;padding:22px;box-shadow:var(--shadow)}
.login-card h1{font-size:22px;font-weight:800}
.ulist{display:flex;flex-direction:column;gap:6px;max-height:52vh;overflow:auto;margin-top:12px}
.ubtn{display:flex;gap:12px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px;text-align:left;cursor:pointer}
.ubtn:hover{border-color:var(--pri)}
.pinbox{display:flex;justify-content:center;gap:10px;margin:18px 0}
.pinbox span{width:14px;height:14px;border-radius:50%;border:2px solid var(--pri)}
.pinbox span.f{background:var(--pri)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pad button{min-height:58px;border-radius:14px;border:1px solid var(--line);background:var(--surface2);font-size:22px;font-weight:600;cursor:pointer}
.pad button:active{background:var(--pri-soft)}

/* ---------- presensi ---------- */
.jgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.jbtn{display:flex;flex-direction:column;gap:6px;align-items:flex-start;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:14px;cursor:pointer;text-align:left;font-weight:700}
.jbtn small{font-weight:500;color:var(--muted);font-size:12px}
.jbtn .ti{width:36px;height:36px;border-radius:10px;display:grid;place-items:center}
.jbtn.masuk .ti{background:var(--ok-soft);color:var(--ok)} .jbtn.pulang .ti{background:var(--info-soft);color:var(--info)}
.jbtn.dl .ti{background:var(--gold-soft);color:var(--gold)} .jbtn.izin .ti,.jbtn.sakit .ti{background:var(--surface2);color:var(--muted)}
.jbtn[disabled]{opacity:.45;cursor:not-allowed}
.timeline{display:flex;flex-direction:column;gap:8px}
.tl{display:flex;gap:12px;align-items:center}
.tl img{width:44px;height:44px;border-radius:10px;object-fit:cover}
.gps{display:flex;gap:8px;align-items:center;font-size:13.5px;padding:10px 12px;border-radius:11px;background:var(--surface2)}
.gps.ok{background:var(--ok-soft);color:var(--ok)} .gps.bad{background:var(--bad-soft);color:var(--bad)}
.shot{width:100%;max-height:320px;object-fit:contain;border-radius:12px;background:var(--surface2)}

/* ---------- table ---------- */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table.tbl{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;white-space:nowrap}
.tbl th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:var(--surface2);position:sticky;top:0}
.tbl .stk{position:sticky;left:0;background:var(--surface);z-index:1;min-width:150px;white-space:normal}
.tbl th.stk{background:var(--surface2);z-index:2}
.tbl td.c,.tbl th.c{text-align:center;padding:7px 4px;min-width:30px}
.k{display:inline-block;min-width:24px;padding:2px 4px;border-radius:6px;font-weight:700;font-size:11.5px}
.k-H{background:var(--ok-soft);color:var(--ok)} .k-T{background:var(--warn-soft);color:var(--warn)} .k-DL{background:var(--info-soft);color:var(--info)}
.k-I,.k-S{background:var(--gold-soft);color:var(--gold)} .k-A{background:var(--bad-soft);color:var(--bad)}
.tbl td.lib{background:var(--surface2)}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden;display:flex}
.bar i{display:block;height:100%}

/* ---------- modal / toast ---------- */
.modal{position:fixed;inset:0;z-index:60;background:rgba(8,20,15,.5);display:flex;align-items:flex-end;justify-content:center}
.modal .box{background:var(--surface);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.modal.big .box{max-width:900px}
@media (min-width:700px){.modal{align-items:center}.modal .box{border-radius:20px}}
.box-h{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.box-h h3{flex:1;font-size:17px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:80;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.toast.bad{background:var(--bad);color:#fff}
.skel{height:64px;border-radius:12px;background:linear-gradient(90deg,var(--surface2),var(--surface),var(--surface2));background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--bad-soft);padding:8px 10px;border-radius:12px;color:var(--bad);font-weight:600;font-size:14px}

/* ---------- dokumen cetak ---------- */
.doc-prev{background:#e9ecea;padding:12px;border-radius:12px;overflow:auto;display:flex;flex-direction:column;gap:12px}
.paper{background:#fff;color:#111;width:210mm;margin:0 auto;padding:18mm 18mm 20mm;font:12pt/1.45 "Times New Roman",Times,serif;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.paper.land{width:297mm}
.paper h2{text-align:center;font-size:12.5pt;font-weight:700;margin:10px 0 2px;text-transform:uppercase}
.paper h3{text-align:center;font-size:12pt;font-weight:700;margin:0 0 12px}
.paper p{margin:6px 0;text-align:justify}
.paper table.pt{border-collapse:collapse;width:100%;font-size:10.5pt;margin:8px 0}
.paper .pt th,.paper .pt td{border:1px solid #000;padding:3px 5px;vertical-align:top;text-align:left}
.paper .pt th{text-align:center;background:#f1f1f1}
.paper .kv td{padding:1px 6px 1px 0;vertical-align:top;border:0}
.kop{display:flex;align-items:center;gap:14px;border-bottom:3px double #000;padding-bottom:8px;margin-bottom:12px}
.kop img{width:70px;height:70px;object-fit:contain}
.kop div{flex:1;text-align:center;line-height:1.25}
.kop b{display:block;font-size:13pt} .kop .big{font-size:16pt} .kop small{font-size:10pt}
.ttd{display:flex;justify-content:space-between;gap:20px;margin-top:24px;flex-wrap:wrap}
.ttd>div{min-width:180px;text-align:center;flex:1}
.ttd .sp{height:64px}
.ttd u{font-weight:700}
.paper ol,.paper ul{margin:4px 0;padding-left:22px}
.paper .dict{display:grid;grid-template-columns:100px 14px 1fr;gap:2px 0}
#printArea{display:none}
@media print{
  @page{size:A4;margin:0}
  body *{visibility:hidden!important}
  #printArea,#printArea *{visibility:visible!important}
  #printArea{display:block;position:absolute;left:0;top:0;width:100%}
  #printArea .paper{box-shadow:none;width:auto;margin:0}
  #printArea .paper+.paper{page-break-before:always}
}
.facebox{display:flex;flex-direction:column;gap:10px}
.facecam{position:relative;width:min(260px,70vw);aspect-ratio:3/4;margin:0 auto;border-radius:50%;overflow:hidden;background:#111}
.facecam video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.fring{position:absolute;inset:0;border-radius:50%;box-shadow:inset 0 0 0 4px rgba(255,255,255,.35);pointer-events:none;transition:box-shadow .3s}
.facebox.done .fring,#fscan.done .fring{box-shadow:inset 0 0 0 5px var(--ok)}
.fbar{height:6px;border-radius:6px;background:var(--surface2);overflow:hidden;width:min(260px,70vw);margin:0 auto}
.fbar i{display:block;height:100%;width:0;background:var(--pri);transition:width .3s}
.fmsg{text-align:center;font-weight:600;min-height:22px;display:flex;gap:6px;justify-content:center;align-items:center;flex-wrap:wrap}
#fscan.done .fmsg{color:var(--ok)}

function call(action, p) {
  const req = Object.assign({ action, token: S.token }, p || {});
  let pr;
  if (MODE === 'http') {
    const berkas = action === 'upload' || action === 'fileData';
    const h = berkas ? { 'Content-Type': 'text/plain;charset=utf-8' } : { 'Content-Type': 'application/json', apikey: SB_KEY };
    if (!berkas && /^eyJ/.test(SB_KEY)) h.Authorization = 'Bearer ' + SB_KEY;
    pr = fetch(berkas ? FILE_URL : SB_URL + '/rest/v1/rpc/api', { method: 'POST', headers: h, body: JSON.stringify(berkas ? req : { req }) })
      .then(r => r.json()).catch(() => { throw new Error('Tidak ada koneksi ke server. Periksa internet Anda.'); });
  } else {
    pr = new Promise(res => setTimeout(() => res(Mock.handle(JSON.parse(JSON.stringify(req)))), 120));
  }
  return pr.then(r => {
    if (r && r.ok) return r.data;
    const e = new Error((r && (r.error || r.message)) || 'Terjadi kesalahan.');
    e.code = r && r.code;
    if (e.code === 'AUTH' && action !== 'login') { logoutLocal(); toast(e.message, 1); }
    throw e;
  });
}

const THUMB = {}, thumbTried = new Set();
function thumb(id, sz) {
  if (!id || id === '•') return '';
  if (MODE === 'demo') { const f = Mock.files[id]; return f && /^image/.test(f.mime) ? `data:${f.mime};base64,${f.data}` : ''; }
  if (THUMB[id]) return THUMB[id];
  return `https://drive.google.com/thumbnail?id=${encodeURIComponent(id)}&sz=w${sz || 400}`;
}
/* Ganti gambar Drive (lambat) dengan gambar kecil tersimpan di Supabase (cepat). */
let thumbTm = null;
async function hydrateThumbs() {
  if (MODE !== 'http' || !S.token) return;
  const imgs = $$('img[src*="drive.google.com/thumbnail"]');
  if (!imgs.length) return;
  const idOf = i => { try { return new URL(i.src).searchParams.get('id'); } catch (e) { return null; } };
  const ids = Array.from(new Set(imgs.map(idOf))).filter(x => x && !THUMB[x] && !thumbTried.has(x));
  if (ids.length) {
    ids.forEach(x => thumbTried.add(x));
    try { Object.assign(THUMB, await call('thumbGet', { ids })); } catch (e) { }
  }
  imgs.forEach(i => { const t = THUMB[idOf(i)]; if (t && i.isConnected) i.src = t; });
}
new MutationObserver(() => { clearTimeout(thumbTm); thumbTm = setTimeout(hydrateThumbs, 40); }).observe(document.body, { childList: true, subtree: true });
async function makeThumb(file) {
  const img = await loadImg(file);
  const s = Math.min(1, 240 / Math.max(img.width, img.height));
  const c = document.createElement('canvas');
  c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', .7);
}
function driveUrl(id) { return `https://drive.google.com/file/d/${encodeURIComponent(id)}/view`; }
async function viewFile(id, priv, name) {
  if (!id || id === '•') return toast('Anda tidak punya izin melihat dokumen ini.', 1);
  if (MODE !== 'demo' && !priv) { window.open(driveUrl(id), '_blank', 'noopener'); return; }
  const m = modal(name || 'Dokumen', '<div class="skel" style="height:240px"></div>', { big: 1 });
  try {
    const f = MODE === 'demo' ? Mock.files[id] : await call('fileData', { id });
    if (!f) throw new Error('Berkas tidak ditemukan.');
    const bin = atob(f.data), arr = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    const url = URL.createObjectURL(new Blob([arr], { type: f.mime }));
    m.body.innerHTML = /^image/.test(f.mime)
      ? `<img src="${url}" alt="" style="width:100%;border-radius:12px">`
      : `<p>Berkas ${esc(f.mime)}.</p><a class="btn pri" href="${url}" target="_blank" rel="noopener">${ic('eye')}Buka berkas</a>`;
  } catch (e) { m.body.innerHTML = `<div class="err">${esc(e.message)}</div>`; }
}
function readB64(file) {
  return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.onerror = () => rej(new Error('Gagal membaca berkas.')); r.readAsDataURL(file); });
}
function loadImg(file) {
  return new Promise((res, rej) => { const u = URL.createObjectURL(file); const i = new Image(); i.onload = () => { res(i); URL.revokeObjectURL(u); }; i.onerror = () => rej(new Error('Foto tidak dapat dibaca.')); i.src = u; });
}
/** Perkecil foto; stamp = teks bukti di bagian bawah (untuk presensi). */
async function shrink(file, max, stamp) {
  const img = await loadImg(file);
  const s = Math.min(1, (max || 1600) / Math.max(img.width, img.height));
  const c = document.createElement('canvas');
  c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
  const g = c.getContext('2d');
  g.drawImage(img, 0, 0, c.width, c.height);
  if (stamp) {
    const fs = Math.max(14, Math.round(c.width / 32));
    const lines = stamp.split('\n');
    const bh = fs * 1.45 * lines.length + fs;
    g.fillStyle = 'rgba(0,0,0,.55)'; g.fillRect(0, c.height - bh, c.width, bh);
    g.fillStyle = '#fff'; g.font = `600 ${fs}px sans-serif`;
    lines.forEach((l, i) => g.fillText(l, fs * .7, c.height - bh + fs * 1.3 + i * fs * 1.45));
  }
  return c.toDataURL('image/jpeg', .74).split(',')[1];
}
async function uploadFile(file, folder) {
  if (file.size > 25 * 1024 * 1024) throw new Error('Ukuran berkas maksimal 25 MB.');
  let data, mime = file.type || 'application/octet-stream', name = file.name;
  if (mime.indexOf('image') === 0 && !/gif|svg/.test(mime)) { data = await shrink(file, 2000); mime = 'image/jpeg'; name = name.replace(/\.\w+$/, '') + '.jpg'; }
  else data = await readB64(file);
  if (MODE === 'demo') { const id = 'demo_' + Math.random().toString(36).slice(2, 10); Mock.files[id] = { mime, data, name }; return { id }; }
  const r = await call('upload', { folder, name, mime, data });
  /* gambar kecil disimpan di Supabase, kecuali dokumen kependudukan (privat) */
  if (mime.indexOf('image') === 0 && String(folder || '').split('/')[0] !== 'Penduduk') {
    try { const t = await makeThumb(file); THUMB[r.id] = t; await call('thumbSave', { id: r.id, data: t }); } catch (e) { }
  }
  return r;
}

  const dots = () => $$('#dots span').forEach((s, i) => s.classList.toggle('f', i < pin.length));
  const submit = async () => {
    if (pin.length < 4) return;
    $('#perr').hidden = true;
    try {
      const r = await call('login', { id: u.id, pin });
      S.token = r.token; store.set('token', r.token); store.set('last_user', u.id);
      boot();
    } catch (e) { pin = ''; dots(); $('#perr').textContent = e.message; $('#perr').hidden = false; }
  };
  const press = n => {
    if (n === 'del') pin = pin.slice(0, -1);
    else if (n === 'ok') return submit();
    else if (pin.length < 6) pin += n;
    dots();
    if (pin.length === 6) submit();
  };
  $('.pad').onclick = e => { const b = e.target.closest('[data-n]'); if (b) press(b.dataset.n); };
  document.onkeydown = e => { if (!$('.pad')) { document.onkeydown = null; return; } if (/^\d$/.test(e.key)) press(e.key); else if (e.key === 'Backspace') press('del'); else if (e.key === 'Enter') press('ok'); };
}
function logoutLocal() { S.token = null; S.user = null; store.set('token', null); loginScreen(); }

async function boot() {

/* ---------------- Pengenal wajah (di perangkat) ----------------
   Memakai face-api (TensorFlow.js). Kamera hanya dipakai di HP ini;
   yang dikirim ke server hanya 128 angka pola wajah, bukan gambar. */
const FACE_LIB = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.15/dist/face-api.js';
const FACE_MODELS = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.15/model';
let faceReady = null;
function loadFace() {
  if (faceReady) return faceReady;
  faceReady = new Promise((res, rej) => {
    if (window.faceapi) return res();
    const s = document.createElement('script'); s.src = FACE_LIB; s.onload = res;
    s.onerror = () => rej(new Error('Pengenal wajah gagal dimuat. Periksa internet lalu coba lagi.'));
    document.head.appendChild(s);
  }).then(() => Promise.all([
    faceapi.nets.tinyFaceDetector.loadFromUri(FACE_MODELS),
    faceapi.nets.faceLandmark68Net.loadFromUri(FACE_MODELS),
    faceapi.nets.faceRecognitionNet.loadFromUri(FACE_MODELS)
  ])).catch(e => { faceReady = null; throw new Error('Pengenal wajah gagal dimuat. Periksa internet lalu coba lagi.'); });
  return faceReady;
}
const sleep = ms => new Promise(r => setTimeout(r, ms));
function vMean(list) { const o = new Array(128).fill(0); list.forEach(v => v.forEach((x, i) => o[i] += x / list.length)); return o; }
function vDist(a, b) { let s = 0; for (let i = 0; i < a.length; i++) s += (a[i] - b[i]) * (a[i] - b[i]); return Math.sqrt(s); }
/* Pindai wajah + cek wajah hidup: lihat lurus, toleh ke satu sisi, toleh ke sisi lain, lihat lurus lagi. */
async function faceScan(box, enroll) {
  const video = $('video', box), msg = $('.fmsg', box), bar = $('.fbar i', box);
  const say = (t, p) => { msg.textContent = t; if (p != null) bar.style.width = p + '%'; };
  box.classList.remove('done');
  say('Memuat pengenal wajah… (pertama kali ±6 MB)', 5);
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('Kamera tidak didukung di peramban ini.');
  const camP = navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } }, audio: false })
    .catch(() => { throw new Error('Kamera tidak dapat dibuka. Izinkan akses kamera untuk aplikasi ini.'); });
  let stream;
  try { [stream] = await Promise.all([camP, loadFace()]); }
  catch (e) { camP.then(s => s.getTracks().forEach(t => t.stop())).catch(() => { }); throw e; }
  const stop = () => stream.getTracks().forEach(t => t.stop());
  box._stop = stop;
  try {
    video.srcObject = stream;
    await video.play();
    const opt = new faceapi.TinyFaceDetectorOptions({ inputSize: 224, scoreThreshold: .5 });
    const NEED = enroll ? 5 : 2;
    const t0 = Date.now();
    let stage = 0, side = 0, lastSeen = Date.now(), front = [];
    const restart = t => { stage = 0; side = 0; front = []; say(t, 10); };
    say('Lihat lurus ke kamera', 10);
    while (true) {
      if (!box.isConnected) throw new Error('Dibatalkan.');
      if (Date.now() - t0 > 45000) throw new Error('Waktu habis. Coba lagi di tempat yang lebih terang.');
      const withDesc = stage === 0 || stage === 3;
      let q = faceapi.detectSingleFace(video, opt).withFaceLandmarks();
      if (withDesc) q = q.withFaceDescriptor();
      const det = await q;
      if (!det) {
        if (stage > 0 && Date.now() - lastSeen > 2500) restart('Wajah hilang dari kamera. Mulai lagi: lihat lurus ke kamera');
        else if (stage === 0) say('Wajah belum terlihat. Hadapkan wajah ke kamera', 10);
        await sleep(100); continue;
      }
      lastSeen = Date.now();
      const p = det.landmarks.positions;
      const yaw = (p[30].x - p[36].x) / ((p[45].x - p[36].x) || 1);
      if (det.detection.box.width < video.videoWidth * .18) { say('Dekatkan wajah ke kamera', null); continue; }
      const lurus = Math.abs(yaw - .5) < .1;
      if (stage === 0) {
        if (lurus) front.push(Array.from(det.descriptor));
        say('Lihat lurus ke kamera… tahan sebentar', 10 + front.length / NEED * 30);
        if (front.length >= NEED) { stage = 1; say('Toleh kepala perlahan ke kiri atau kanan', 45); }
      } else if (stage === 1) {
        if (yaw < .38) { side = -1; stage = 2; } else if (yaw > .62) { side = 1; stage = 2; }
        if (stage === 2) say('Bagus. Sekarang toleh ke arah sebaliknya', 65);
      } else if (stage === 2) {
        if (side < 0 ? yaw > .62 : yaw < .38) { stage = 3; say('Kembali lihat lurus ke kamera', 85); }
      } else if (stage === 3 && lurus) {
        const d = Array.from(det.descriptor);
        if (vDist(d, vMean(front)) > .45) { restart('Wajah berubah di tengah pemeriksaan. Mulai lagi: lihat lurus ke kamera'); continue; }
        front.push(d);
        say('Selesai', 100);
        return vMean(front).map(x => Math.round(x * 1e5) / 1e5);
      }
    }
  } finally { stop(); }
}

function rekapCompute(r) {
  const K = { 'Hadir': 'H', 'Hadir Terlambat': 'T', 'Dinas Luar': 'DL', 'Izin': 'I', 'Sakit': 'S' };
  return {
    bulan: r.bulan, days: r.days, users: r.users.map(usr => {
      const masuk = {}, pulang = {};
      r.recs.filter(x => x.user_id === usr.id).forEach(x => {
        if (x.jenis === 'Pulang') pulang[x.tanggal] = x.status === 'Pulang Awal' ? 'PA' : 'P';
        else if (!masuk[x.tanggal] || x.jenis !== 'Dinas Luar') masuk[x.tanggal] = K[x.status] || K[x.jenis] || '?';
      });
      const j = { hari_kerja: 0, H: 0, T: 0, DL: 0, I: 0, S: 0, P: 0, PA: 0, A: 0 };
      r.days.forEach(d => {
        if (d.libur) return;
        j.hari_kerja++;
        const k = masuk[d.tgl];
        if (k) j[k] = (j[k] || 0) + 1;
        else if (d.tgl < r.today) { j.A++; masuk[d.tgl] = 'A'; }
        if (pulang[d.tgl]) j[pulang[d.tgl]]++;
      });
      return { id: usr.id, nama: usr.nama, jabatan: usr.jabatan, masuk, pulang, jml: j };
    })
  };
}

function fieldHtml(f, v, rec) {

      inp = `<select id="${id}"><option value="">— pilih —</option>${opts.map(o => `<option ${o === v ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select>`; break;
    }
    case 'money': inp = `<input id="${id}" inputmode="numeric" data-money value="${v ? Number(nOnly(v)).toLocaleString('id-ID') : ''}" placeholder="0">`; break;
    case 'date': inp = `<input id="${id}" type="date" value="${esc(v)}">`; break;
    case 'time': inp = `<input id="${id}" type="time" value="${esc(String(v).slice(0, 5))}">`; break;
    case 'number': inp = `<input id="${id}" type="number" inputmode="numeric" value="${esc(v)}">`; break;
    case 'geo': inp = `<div class="btns" style="flex-wrap:nowrap"><input id="${id}" value="${esc(v)}" placeholder="-8.2367, 113.1907" style="flex:1"><button type="button" class="btn sm" data-act="geo" data-t="${id}">${ic('pin')}Lokasi saya</button></div>`; break;
    case 'file': {
      const locked = v === '•';
      inp = `<div class="filebox">${v ? `<button type="button" class="btn sm" data-act="file" data-id="${esc(v)}" data-priv="${f.priv ? 1 : 0}" data-name="${esc(f.l)}">${ic(locked ? 'lock' : 'eye')}Berkas tersimpan</button>` : ''}
        ${locked ? '<span class="hint">Anda tidak punya izin mengganti dokumen kependudukan.</span>' : `<input type="file" id="${id}" accept="${f.img ? IMG_ANY : 'application/pdf,' + IMG_ANY + ',.doc,.docx,.xls,.xlsx'}"><span class="hint">${v ? 'Pilih berkas baru untuk mengganti.' : f.img ? 'Foto akan diperkecil otomatis.' : 'PDF atau foto, maks. 25 MB.'}</span>`}</div>`;
      break;
    }
    case 'sdgs': inp = `<div class="checks" id="${id}">${(S.sdgs || []).map(s => `<label title="${esc(s.parameter)}"><input type="checkbox" value="${esc(s.no)}" ${String(v).split(',').indexOf(String(s.no)) >= 0 ? 'checked' : ''}>${esc(s.no)}. ${esc(s.tujuan)}</label>`).join('') || '<span class="hint">Referensi SDGs belum ada.</span>'}</div>`; break;
    case 'refpick': inp = `<div class="btns" style="flex-wrap:nowrap"><input id="${id}" value="${esc(v)}" style="flex:1"><button type="button" class="btn sm" data-act="pick">${ic('list')}Pilih kode</button></div>`; break;
    default: {
      const dl = f.list ? `<datalist id="dl_${f.k}">${f.list.map(o => `<option value="${esc(o)}">`).join('')}</datalist>` : '';
      const sens = f.sens && v.indexOf('•') >= 0;
      inp = `<input id="${id}" type="${f.t === 'email' ? 'email' : f.t === 'tel' ? 'tel' : 'text'}" value="${esc(v)}" ${f.list ? `list="dl_${f.k}"` : ''} ${f.len ? `maxlength="${f.len}" inputmode="numeric"` : ''} ${f.mono ? 'class="mono"' : ''} ${sens ? 'readonly' : ''}>${dl}`;
      if (sens) inp += '<span class="hint">Tersamar. Anda tidak punya izin mengubah NIK/KK.</span>';
    }
  }
  return `<div class="f${wide}">${lab}${inp}${hint}</div>`;
}
function readForm(u, root) {
  const v = {};
  u.fields.forEach(f => {
    const el = $('#f_' + f.k, root);
    if (!el || f.t === 'file') return;
    if (f.t === 'sdgs') v[f.k] = $$('input:checked', el).map(i => i.value).join(',');
    else if (f.t === 'money') v[f.k] = nOnly(el.value);
    else {
      let s = el.value.trim();
      if (f.up) s = s.toUpperCase();
      if (f.pad && /^\d+$/.test(s)) s = s.padStart(f.pad, '0');
      v[f.k] = s;
    }
  });
  return v;
}

    const list = rows.filter(r => !q || (r.kode_uraian + ' ' + r.kode_kegiatan + ' ' + r.kegiatan + ' ' + r.uraian_output + ' ' + r.nama_bidang).toLowerCase().indexOf(q) >= 0).slice(0, 80);
    $('#bl', m.el).innerHTML = list.length ? `<div class="list">${list.map(r => `<button class="row" data-k="${esc(r.id)}"><span class="av" style="width:auto;padding:0 8px"><span class="mono">${esc(r.kode_kegiatan)}</span></span><span class="main"><span class="t">${esc(r.kegiatan)}</span><span class="s">${esc(r.uraian_output)} · ${esc(r.satuan)}<br>${esc(r.nama_bidang)}</span></span></button>`).join('')}</div>` : '<div class="empty">Tidak ditemukan. Isi referensi di menu Perencanaan › Referensi.</div>';
  };
  call('list', { entity: 'ref_bidang', limit: 5000, desc: false }).then(r => { rows = r.rows; draw(''); }).catch(x => { $('#bl', m.el).innerHTML = `<div class="err">${esc(x.message)}</div>`; });

  $('#bl', m.el).onclick = ev => { const b = ev.target.closest('[data-k]'); if (b) { cb(rows.find(r => r.id === b.dataset.k)); m.close(); } };
}

async function rkpDoc(kind, mu) {

  if (kind === 'rktl') return printDocs('Form 03', [docRktl(await listAll('rkp_jadwal', { sort: 'tanggal', desc: false }))]);
  if (kind === 'f4') return printDocs('Form 04', [docRegister(UI.rkp_usulan.print, await listAll('rkp_usulan', { sort: 'kode_kegiatan', desc: false }), 'RKP Desa Tahun ' + y)]);

    if (!ms.length) throw new Error('Belum ada data "Musdes Pembentukan Tim RKP Desa" untuk tahun ' + y + '. Isi dulu di Form 01–02.');
    mu = ms[0];

    call('list', { entity: 'ref_hukum', limit: 200, sort: 'no', desc: false }).then(r => r.rows.filter(x => x.status !== 'Tidak Aktif'))
  ]);
  if (kind === 'ba') return printDocs('Berita Acara', [docBA(mu, tim, nara)]);

}

function printDocs(title, pages) {
  const html = pages.join('');
  const m = modal(title, `<div class="stack"><div class="btns"><button class="btn pri" id="doPrint">${ic('print')}Cetak / simpan PDF</button></div>${MODE === 'demo' ? '<div class="meta">Ini pratinjau. Tombol cetak berfungsi di aplikasi yang sudah dipasang.</div>' : '<div class="meta">Pilih "Simpan sebagai PDF" di jendela cetak untuk menyimpan berkas.</div>'}<div class="doc-prev">${html}</div></div>`, { big: 1 });
  const fit = () => { const box = $('.doc-prev', m.el); if (!box) return; $$('.paper', box).forEach(pp => { pp.style.zoom = 1; const w = pp.getBoundingClientRect().width; const avail = box.clientWidth - 24; pp.style.zoom = w > avail ? (avail / w).toFixed(3) : 1; }); };
  requestAnimationFrame(fit);
  $('#doPrint', m.el).onclick = () => {
    $('#printArea').innerHTML = html;
    const land = pages.some(p => /paper land/.test(p));
    let st = $('#pgsz'); if (!st) { st = document.createElement('style'); st.id = 'pgsz'; document.head.appendChild(st); }
    st.textContent = '@media print{@page{size:A4 ' + (land ? 'landscape' : 'portrait') + ';margin:0}}';
    setTimeout(() => window.print(), 50);
  };
}

    upload: r => { const i = 'demo_' + id(); files[i] = { mime: r.mime, data: r.data }; return { id: i }; },
    usersList: (r, u) => { if (!u.admin) err('Hanya admin.'); return users.map(x => ({ id: x.id, nama: x.nama, jabatan: x.jabatan, admin: x.admin, aktif: x.aktif, urut: x.urut, akses: x.akses.slice() })); },
    usersSave: (r, u) => {
      if (!u.admin) err('Hanya admin.'); const x = r.user; if (!String(x.nama || '').trim()) err('Nama wajib diisi.');
      let o = x.id && users.find(y => y.id === x.id);
      if (!o) { if (!/^\d{4,6}$/.test(x.pin || '')) err('PIN awal harus 4–6 angka.'); o = { id: id() }; users.push(o); }
      else if (x.pin && !/^\d{4,6}$/.test(x.pin)) err('PIN harus 4–6 angka.');
      Object.assign(o, { nama: x.nama.trim(), jabatan: x.jabatan, admin: !!x.admin, aktif: x.aktif !== false, akses: x.akses || [], urut: x.urut }); if (x.pin) o.pin = x.pin; return true;
    },
    usersRemove: (r, u) => { if (r.id === u.id) err('Tidak bisa menghapus akun sendiri.'); const i = users.findIndex(x => x.id === r.id); users.splice(i, 1); return true; },
    usersFromAparat: (r, u) => { if (!/^\d{4,6}$/.test(r.pin || '')) err('PIN awal harus 4–6 angka.'); let c = 0; T.aparat.forEach(a => { if (!users.some(x => x.nama.toLowerCase() === a.nama.toLowerCase())) { users.push({ id: id(), nama: a.nama, jabatan: a.jabatan, admin: false, aktif: true, akses: [], urut: a.no_urut, pin: r.pin }); c++; } }); return { dibuat: c }; },
    changePin: (r, u) => { const o = users.find(x => x.id === u.id); if (o.pin !== r.lama) err('PIN lama salah.'); if (!/^\d{4,6}$/.test(r.baru || '')) err('PIN baru harus 4–6 angka.'); o.pin = r.baru; return true; },
    faceEnroll: () => true,
    faceReset: () => true,
    thumbSave: () => true,
    thumbGet: () => ({}),
    settingsSave: (r, u) => { if (!u.admin) err('Hanya admin.'); Object.assign(set, r.values); return Object.assign({}, set); }
  };
  function uo(u) { return { id: u.id, nama: u.nama, jabatan: u.jabatan, admin: u.admin, akses: u.admin ? PERMS.map(p => p.k) : u.akses.slice() }; }
  function handle(req) {
    try {
      const fn = A[req.action]; if (!fn) err('Aksi tidak dikenal: ' + req.action);
      let u = null;
      if (['publicUsers', 'login'].indexOf(req.action) < 0) { const x = users.find(y => y.id === sess[req.token]); if (!x) { const e = new Error('Sesi berakhir, silakan masuk lagi.'); e.code = 'AUTH'; throw e; } u = uo(x); }
      return { ok: true, data: fn(req, u) };
    } catch (e) { return { ok: false, error: e.message, code: e.code || '' }; }
  }
  return { handle, files };
