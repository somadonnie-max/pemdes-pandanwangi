<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f5a46">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pemdes PW">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f5a46'/%3E%3Ctext x='32' y='41' font-family='Arial' font-weight='700' font-size='24' fill='white' text-anchor='middle'%3EPW%3C/text%3E%3C/svg%3E">
<title>Pemdes Pandanwangi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#f2f5f4; --surface:#ffffff; --surface2:#eaf0ed; --ink:#15211c; --muted:#5f6f68; --line:#dde5e1;
  --pri:#0f5a46; --pri-2:#0b4838; --pri-ink:#ffffff; --pri-soft:#dcede5;
  --gold:#b0770c; --gold-soft:#f8edd3;
  --ok:#1d7a48; --ok-soft:#dff2e6; --warn:#98640a; --warn-soft:#fbeed3; --bad:#b3261e; --bad-soft:#fae1de; --info:#1d5f9e; --info-soft:#e1ecf7;
  --shadow:0 1px 2px rgba(15,40,30,.05),0 4px 14px rgba(15,40,30,.06);
  --r:10px; --font:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0d1512; --surface:#141f1b; --surface2:#1b2924; --ink:#e4ede9; --muted:#95a69e; --line:#27362f;
    --pri:#58c39b; --pri-2:#3fa983; --pri-ink:#062519; --pri-soft:#163a2e;
    --gold:#e4b24a; --gold-soft:#3a2d12;
    --ok:#5cc98b; --ok-soft:#173a28; --warn:#e3ad4c; --warn-soft:#3b2d12; --bad:#f0827a; --bad-soft:#442320; --info:#7fb1e6; --info-soft:#1b2d42;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0d1512; --surface:#141f1b; --surface2:#1b2924; --ink:#e4ede9; --muted:#95a69e; --line:#27362f;
  --pri:#58c39b; --pri-2:#3fa983; --pri-ink:#062519; --pri-soft:#163a2e;
  --gold:#e4b24a; --gold-soft:#3a2d12;
  --ok:#5cc98b; --ok-soft:#173a28; --warn:#e3ad4c; --warn-soft:#3b2d12; --bad:#f0827a; --bad-soft:#442320; --info:#7fb1e6; --info-soft:#1b2d42;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.45 var(--font);-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--pri)}
h1,h2,h3{margin:0;line-height:1.25;text-wrap:balance}
.mono{font-family:var(--mono);font-size:.9em;letter-spacing:-.02em}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.ic{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- shell ---------- */
.app{min-height:100%;display:flex}
.side{display:none}
.shell{flex:1;min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--pri);color:var(--pri-ink);display:flex;align-items:center;gap:6px;padding:6px 10px;min-height:46px}
.top .title{flex:1;min-width:0;font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sub{display:inline;font-weight:500;font-size:11.5px;opacity:.75;margin-left:6px}
.iconbtn{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:9px;border:0;background:transparent;color:inherit;cursor:pointer}
.iconbtn .ic{width:18px;height:18px}
.iconbtn:hover{background:rgba(255,255,255,.12)}
main{flex:1;width:100%;max-width:1100px;margin:0 auto;padding:10px 10px 84px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{flex:1;border:0;background:none;padding:6px 4px 7px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:10.5px;font-weight:600;color:var(--muted);cursor:pointer}
.tabs button.on{color:var(--pri)}
.tabs .ic{width:19px;height:19px}
@media (min-width:900px){
  .side{display:flex;flex-direction:column;width:224px;flex:none;position:sticky;top:0;height:100vh;overflow:auto;background:var(--surface);border-right:1px solid var(--line);padding:12px 8px}
  .tabs{display:none}
  main{padding:14px 18px 32px}
}
.brand{display:flex;gap:8px;align-items:center;padding:2px 6px 10px}
.seal{width:32px;height:32px;border-radius:9px;background:var(--pri);color:var(--pri-ink);display:grid;place-items:center;font-weight:800;font-size:12px;flex:none}
.seal img{width:100%;height:100%;object-fit:contain;border-radius:9px;background:#fff}
.brand b{display:block;font-size:13px}
.brand span{font-size:11px;color:var(--muted)}
.nav-h{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:10px 8px 2px}
.nav-i{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;text-align:left;padding:5px 8px;border-radius:7px;cursor:pointer;font-size:12.5px;color:var(--ink)}
.nav-i:hover{background:var(--surface2)}
.nav-i.on{background:var(--pri-soft);color:var(--pri);font-weight:600}
.nav-i .ic{width:15px;height:15px;color:var(--muted)}
.nav-i.on .ic{color:var(--pri)}

/* ---------- blocks ---------- */
.stack{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 2px -2px}
.sec-h h2{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.grid{display:grid;gap:6px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.tile{display:flex;gap:8px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:7px 9px;cursor:pointer;min-height:42px;transition:border-color .15s,background .15s}
.tile:hover{border-color:var(--pri);background:var(--pri-soft)}
.tile .ti{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;background:var(--pri-soft);color:var(--pri);flex:none}
.tile b{font-size:12px;font-weight:600;line-height:1.25;flex:1;min-width:0}
.tile small{color:var(--muted);font-size:10.5px;display:block;font-weight:500}
.tile.soon{opacity:.6}
.tile .cnt{font-family:var(--mono);font-size:10.5px;color:var(--muted)}

.hero{background:linear-gradient(135deg,var(--pri),var(--pri-2));color:var(--pri-ink);border-radius:12px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-30px;top:-40px;width:120px;height:120px;border-radius:50%;border:18px solid rgba(255,255,255,.07)}
.hero .hi{font-size:11.5px;opacity:.85}
.hero h1{font-size:14.5px;font-weight:700}
.hero .who{flex:1;min-width:150px}
.clock{font-family:var(--mono);font-size:20px;font-weight:500;letter-spacing:-.03em;line-height:1}
.hero .hrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;position:relative;z-index:1;width:100%}
.hero .hrow .hi{flex:1;min-width:160px}
.hero .btn{background:var(--pri-ink);color:var(--pri);border-color:transparent}
.hero .ghost{background:rgba(255,255,255,.14);color:var(--pri-ink);border-color:rgba(255,255,255,.22)}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:6px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:6px 9px;text-align:left;cursor:default}
button.stat{cursor:pointer}
button.stat:hover{border-color:var(--pri)}
.stat b{display:block;font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.stat span{font-size:10.5px;color:var(--muted)}

.pill{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.info{background:var(--info-soft);color:var(--info)}
.pill.pri{background:var(--pri-soft);color:var(--pri)} .pill.gold{background:var(--gold-soft);color:var(--gold)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:5px 11px;font-weight:600;font-size:12.5px;cursor:pointer;min-height:32px;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--pri)}
.btn.pri{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}
.btn.pri:hover{background:var(--pri-2)}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.danger.solid{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.sm{min-height:26px;padding:2px 8px;font-size:11.5px;border-radius:7px}
.btn.sm .ic{width:14px;height:14px}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.btn.block{width:100%}
.btns{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.fab{position:fixed;right:14px;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:25;border-radius:12px;min-height:40px;padding:0 14px;box-shadow:var(--shadow)}
@media (min-width:900px){.fab{bottom:22px;right:24px}}

/* ---------- list ---------- */
.toolbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.search{flex:1 1 200px;display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:0 9px;min-height:32px}
.search input{border:0;background:none;outline:0;flex:1;min-width:0;padding:5px 0}
.chips{display:flex;gap:4px;overflow-x:auto;padding-bottom:1px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:600;white-space:nowrap;cursor:pointer;color:var(--muted)}
.chip.on{background:var(--pri);border-color:var(--pri);color:var(--pri-ink)}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.it{border-top:1px solid var(--line)}
.it:first-child{border-top:0}
.it.open{background:var(--surface2)}
.row{display:flex;gap:9px;align-items:center;padding:6px 10px;border:0;background:none;text-align:left;cursor:pointer;width:100%;min-height:40px}
.it>.row:hover{background:var(--surface2)}
.it.open>.row{background:var(--pri-soft)}
.row .main{flex:1;min-width:0}
.row .t{font-weight:600;font-size:12.5px;line-height:1.3;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:11.5px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s2{font-size:11px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.9}
.row .r{text-align:right;flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-size:11px;color:var(--muted);max-width:40%}
.row .chev{color:var(--muted);transition:transform .15s}
.it.open>.row .chev{transform:rotate(180deg)}
.av{width:28px;height:28px;border-radius:8px;background:var(--pri-soft);color:var(--pri);display:grid;place-items:center;font-weight:700;font-size:10.5px;flex:none;overflow:hidden}
.av .ic{width:15px;height:15px}
.av img{width:100%;height:100%;object-fit:cover}
.xp{padding:4px 10px 10px 47px;display:flex;flex-direction:column;gap:8px}
@media (max-width:520px){.xp{padding-left:10px}}
.empty{padding:22px 12px;text-align:center;color:var(--muted)}
.empty .ic{width:28px;height:28px;margin:0 auto 6px;display:block;opacity:.6}
.meta{font-size:11px;color:var(--muted)}

/* ---------- detail ---------- */
.dl{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin:0}
.dl>div{background:var(--surface);padding:4px 8px;min-width:0}
.dl .w{grid-column:1/-1}
.dl dt{color:var(--muted);font-size:10.5px;margin:0}
.dl dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font-size:12.5px}
.d-head{display:flex;gap:10px;align-items:center}
.d-head h1{font-size:15px}
.photo{width:56px;height:56px;border-radius:10px;object-fit:cover;background:var(--surface2);flex:none}
.map{position:relative;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface2)}
.map iframe{display:block;width:100%;height:220px;border:0}
.map .mbar{display:flex;gap:4px;align-items:center;padding:4px 6px;background:var(--surface);border-top:1px solid var(--line);font-size:11px}
.map .mbar .sp{flex:1}
.linkbtn{border:0;background:none;padding:0;color:var(--pri);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:2px}

/* ---------- form ---------- */
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px 10px}
.f{display:flex;flex-direction:column;gap:3px;min-width:0}
.f.wide{grid-column:1/-1}
.f label,.lbl{font-size:11px;font-weight:600;color:var(--muted)}
.f label i{color:var(--bad);font-style:normal}
.inp,.f input:not([type=checkbox]):not([type=radio]):not([type=file]),.f select,.f textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:5px 8px;min-height:32px;outline:0;font-size:12.5px}
.f textarea{min-height:56px;resize:vertical}
.f input[type=file]{font-size:11.5px}
.inp:focus,.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--pri);box-shadow:0 0 0 2px var(--pri-soft)}
.hint{font-size:10.5px;color:var(--muted)}
.checks{display:flex;flex-wrap:wrap;gap:4px}
.checks label{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:7px;padding:3px 8px;font-size:11.5px;font-weight:500;color:var(--ink);cursor:pointer;background:var(--surface)}
.checks input{accent-color:var(--pri)}
.checks label:has(input:checked){border-color:var(--pri);background:var(--pri-soft)}
.filebox{display:flex;flex-wrap:wrap;gap:6px;align-items:center;border:1px dashed var(--line);border-radius:7px;padding:5px 7px}
.switch{display:flex;align-items:center;gap:7px;font-weight:500;font-size:12.5px}
.switch input{width:16px;height:16px;accent-color:var(--pri)}
.err{background:var(--bad-soft);color:var(--bad);border-radius:8px;padding:6px 9px;font-size:12px}
.ok-box{background:var(--ok-soft);color:var(--ok);border-radius:8px;padding:6px 9px;font-size:12px}
.pick{position:relative}
.pickl{position:absolute;left:0;right:0;top:100%;z-index:40;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);max-height:240px;overflow:auto;margin-top:2px}
.pickl button{display:block;width:100%;text-align:left;border:0;background:none;padding:5px 9px;cursor:pointer;font-size:12px;border-top:1px solid var(--line)}
.pickl button:first-child{border-top:0}
.pickl button:hover,.pickl button.on{background:var(--pri-soft)}
.pickl small{color:var(--muted);display:block;font-size:10.5px}

/* ---------- login ---------- */
.login{min-height:100vh;display:grid;place-items:center;padding:20px 14px;background:radial-gradient(circle at 20% 0%,var(--pri-2),var(--pri) 60%)}
.login-card{width:100%;max-width:360px;background:var(--surface);border-radius:16px;padding:18px;box-shadow:var(--shadow)}
.login-card h1{font-size:17px;font-weight:800}
.or{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:11px;margin:4px 0}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.gbtn{background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.gbtn svg{width:16px;height:16px}

/* ---------- presensi ---------- */
.jgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:6px}
.jbtn{display:flex;gap:7px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:7px 9px;cursor:pointer;text-align:left;font-weight:700;font-size:12.5px}
.jbtn small{font-weight:500;color:var(--muted);font-size:10px;display:block}
.jbtn .ti{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;flex:none}
.jbtn.masuk .ti{background:var(--ok-soft);color:var(--ok)} .jbtn.pulang .ti{background:var(--info-soft);color:var(--info)}
.jbtn.dl .ti{background:var(--gold-soft);color:var(--gold)} .jbtn.izin .ti,.jbtn.sakit .ti{background:var(--surface2);color:var(--muted)}
.jbtn[disabled]{opacity:.45;cursor:not-allowed}
.timeline{display:flex;flex-direction:column;gap:6px}
.tl{display:flex;gap:8px;align-items:center}
.tl img{width:32px;height:32px;border-radius:7px;object-fit:cover}
.gps{display:flex;gap:6px;align-items:center;font-size:12px;padding:6px 9px;border-radius:8px;background:var(--surface2)}
.gps.ok{background:var(--ok-soft);color:var(--ok)} .gps.bad{background:var(--bad-soft);color:var(--bad)}
.shot{width:100%;max-height:260px;object-fit:contain;border-radius:8px;background:var(--surface2)}

/* ---------- table ---------- */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table.tbl{border-collapse:collapse;width:100%;font-size:11.5px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:4px 6px;text-align:left;white-space:nowrap}
.tbl th{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:var(--surface2);position:sticky;top:0}
.tbl .stk{position:sticky;left:0;background:var(--surface);z-index:1;min-width:130px;white-space:normal}
.tbl th.stk{background:var(--surface2);z-index:2}
.tbl td.c,.tbl th.c{text-align:center;padding:4px 3px;min-width:24px}
.k{display:inline-block;min-width:20px;padding:1px 3px;border-radius:5px;font-weight:700;font-size:10px}
.k-H{background:var(--ok-soft);color:var(--ok)} .k-T{background:var(--warn-soft);color:var(--warn)} .k-DL{background:var(--info-soft);color:var(--info)}
.k-I,.k-S{background:var(--gold-soft);color:var(--gold)} .k-A{background:var(--bad-soft);color:var(--bad)}
.tbl td.lib{background:var(--surface2)}
.bar{height:6px;border-radius:99px;background:var(--surface2);overflow:hidden;display:flex}
.bar i{display:block;height:100%}

/* ---------- modal / toast ---------- */
.modal{position:fixed;inset:0;z-index:60;background:rgba(8,20,15,.5);display:flex;align-items:flex-end;justify-content:center}
.modal .box{background:var(--surface);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:14px 14px 0 0;padding:12px 12px calc(14px + env(safe-area-inset-bottom,0px))}
.modal.big .box{max-width:900px}
@media (min-width:700px){.modal{align-items:center}.modal .box{border-radius:14px}}
.box-h{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.box-h h3{flex:1;font-size:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(70px + env(safe-area-inset-bottom,0px));z-index:80;background:var(--ink);color:var(--bg);padding:7px 12px;border-radius:9px;font-size:12.5px;max-width:calc(100% - 28px);box-shadow:var(--shadow)}
.toast.bad{background:var(--bad);color:#fff}
.skel{height:40px;border-radius:8px;background:linear-gradient(90deg,var(--surface2),var(--surface),var(--surface2));background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
.confirm{display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--bad-soft);padding:5px 8px;border-radius:8px;color:var(--bad);font-weight:600;font-size:12px}
details.more>summary{cursor:pointer;color:var(--muted);font-size:11.5px;font-weight:600;padding:2px}

/* ---------- dokumen cetak ---------- */
.doc-prev{background:#e9ecea;padding:10px;border-radius:10px;overflow:auto;display:flex;flex-direction:column;gap:10px}
.paper{background:#fff;color:#111;width:210mm;margin:0 auto;padding:18mm 18mm 20mm;font:12pt/1.45 "Times New Roman",Times,serif;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.paper.land{width:297mm}
.paper h2{text-align:center;font-size:12.5pt;font-weight:700;margin:10px 0 2px;text-transform:uppercase}
.paper h3{text-align:center;font-size:12pt;font-weight:700;margin:0 0 12px}
.paper p{margin:6px 0;text-align:justify}
.paper table.pt{border-collapse:collapse;width:100%;font-size:10.5pt;margin:8px 0}
.paper .pt th,.paper .pt td{border:1px solid #000;padding:3px 5px;vertical-align:top;text-align:left}
.paper .pt th{text-align:center;background:#f1f1f1}
.paper .kv td{padding:1px 6px 1px 0;vertical-align:top;border:0}
.kop{display:flex;align-items:center;gap:14px;border-bottom:3px double #000;padding-bottom:8px;margin-bottom:12px}
.kop img{width:70px;height:70px;object-fit:contain}
.kop div{flex:1;text-align:center;line-height:1.25}
.kop b{display:block;font-size:13pt} .kop .big{font-size:16pt} .kop small{font-size:10pt}
.ttd{display:flex;justify-content:space-between;gap:20px;margin-top:24px;flex-wrap:wrap}
.ttd>div{min-width:180px;text-align:center;flex:1}
.ttd .sp{height:64px}
.ttd u{font-weight:700}
.paper ol,.paper ul{margin:4px 0;padding-left:22px}
.paper .dict{display:grid;grid-template-columns:100px 14px 1fr;gap:2px 0}
#printArea{display:none}
@media print{
  @page{size:A4;margin:0}
  body *{visibility:hidden!important}
  #printArea,#printArea *{visibility:visible!important}
  #printArea{display:block;position:absolute;left:0;top:0;width:100%}
  #printArea .paper{box-shadow:none;width:auto;margin:0}
  #printArea .paper+.paper{page-break-before:always}
}
.facebox{display:flex;flex-direction:column;gap:8px}
.facecam{position:relative;width:min(220px,62vw);aspect-ratio:3/4;margin:0 auto;border-radius:50%;overflow:hidden;background:#111}
.facecam video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.fring{position:absolute;inset:0;border-radius:50%;box-shadow:inset 0 0 0 4px rgba(255,255,255,.35);pointer-events:none;transition:box-shadow .3s}
.facebox.done .fring,#fscan.done .fring{box-shadow:inset 0 0 0 5px var(--ok)}
.fbar{height:5px;border-radius:5px;background:var(--surface2);overflow:hidden;width:min(220px,62vw);margin:0 auto}
.fbar i{display:block;height:100%;width:0;background:var(--pri);transition:width .3s}
.fmsg{text-align:center;font-weight:600;min-height:20px;display:flex;gap:6px;justify-content:center;align-items:center;flex-wrap:wrap}
#fscan.done .fmsg{color:var(--ok)}
</style>

const S = { token: store.get('token'), user: null, perms: [], set: {}, stack: [], cur: null, seq: 0, rkpYear: null, vh: {} };

const FILE_ACTIONS = ['upload', 'fileData', 'makeDoc', 'tplList', 'makeKK'];
function call(action, p, bearer) {
  const req = Object.assign({ action, token: S.token }, p || {});
  const berkas = FILE_ACTIONS.indexOf(action) >= 0;
  const h = berkas ? { 'Content-Type': 'text/plain;charset=utf-8' } : { 'Content-Type': 'application/json', apikey: SB_KEY };
  if (!berkas) h.Authorization = 'Bearer ' + (bearer || SB_KEY);
  if (!berkas && !bearer && !/^eyJ/.test(SB_KEY)) delete h.Authorization;
  return fetch(berkas ? FILE_URL : SB_URL + '/rest/v1/rpc/api', { method: 'POST', headers: h, body: JSON.stringify(berkas ? req : { req }) })
    .then(r => r.json()).catch(() => { throw new Error('Tidak ada koneksi ke server. Periksa internet Anda.'); })
    .then(r => {
      if (r && r.ok) return r.data;
      const e = new Error((r && (r.error || r.message || r.msg)) || 'Terjadi kesalahan.');
      e.code = r && r.code;
      if (e.code === 'AUTH' && action !== 'login') { logoutLocal(); toast(e.message, 1); }
      throw e;
    });
}
const can = p => !p || p === '*' || (S.user && (S.user.admin || (p !== 'admin' && S.user.akses.indexOf(p) >= 0)));
const canRead = e => can(UI[e].read || '*');
const canWrite = e => can(UI[e].write || UI[e].perm);

  setTimeout(() => t.remove(), bad ? 4200 : 2600);
}
function modal(title, html, opts) {
  opts = opts || {};

const THUMB = {}, thumbTried = new Set();
function thumb(id, sz) {
  if (!id || id === '•') return '';
  if (THUMB[id]) return THUMB[id];
  return `https://drive.google.com/thumbnail?id=${encodeURIComponent(id)}&sz=w${sz || 400}`;
}
/* Ganti gambar Drive (lambat) dengan gambar kecil tersimpan di Supabase (cepat). */
let thumbTm = null;
async function hydrateThumbs() {
  if (!S.token) return;
  const imgs = $$('img[src*="drive.google.com/thumbnail"]');
  if (!imgs.length) return;
  const idOf = i => { try { return new URL(i.src).searchParams.get('id'); } catch (e) { return null; } };
  const ids = Array.from(new Set(imgs.map(idOf))).filter(x => x && !THUMB[x] && !thumbTried.has(x));
  if (ids.length) {
    ids.forEach(x => thumbTried.add(x));
    try { Object.assign(THUMB, await call('thumbGet', { ids })); } catch (e) { }
  }
  imgs.forEach(i => { const t = THUMB[idOf(i)]; if (t && i.isConnected) i.src = t; });
}
new MutationObserver(() => { clearTimeout(thumbTm); thumbTm = setTimeout(hydrateThumbs, 40); }).observe(document.body, { childList: true, subtree: true });
async function makeThumb(file) {
  const img = await loadImg(file);
  const s = Math.min(1, 240 / Math.max(img.width, img.height));
  const c = document.createElement('canvas');
  c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', .7);
}
function driveUrl(id) { return `https://drive.google.com/file/d/${encodeURIComponent(id)}/view`; }
async function viewFile(id, priv, name) {
  if (!id || id === '•') return toast('Anda tidak punya izin melihat dokumen ini.', 1);
  if (!priv) { window.open(driveUrl(id), '_blank', 'noopener'); return; }
  const m = modal(name || 'Dokumen', '<div class="skel" style="height:240px"></div>', { big: 1 });
  try {
    const f = await call('fileData', { id });
    if (!f) throw new Error('Berkas tidak ditemukan.');
    const bin = atob(f.data), arr = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    const url = URL.createObjectURL(new Blob([arr], { type: f.mime }));
    m.body.innerHTML = /^image/.test(f.mime)
      ? `<img src="${url}" alt="" style="width:100%;border-radius:12px">`
      : `<p>Berkas ${esc(f.mime)}.</p><a class="btn pri" href="${url}" target="_blank" rel="noopener">${ic('eye')}Buka berkas</a>`;
  } catch (e) { m.body.innerHTML = `<div class="err">${esc(e.message)}</div>`; }
}
function readB64(file) {
  return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.onerror = () => rej(new Error('Gagal membaca berkas.')); r.readAsDataURL(file); });
}
function loadImg(file) {
  return new Promise((res, rej) => { const u = URL.createObjectURL(file); const i = new Image(); i.onload = () => { res(i); URL.revokeObjectURL(u); }; i.onerror = () => rej(new Error('Foto tidak dapat dibaca.')); i.src = u; });
}
/** Perkecil foto; stamp = teks bukti di bagian bawah (untuk presensi). */
async function shrink(file, max, stamp) {
  const img = await loadImg(file);
  const s = Math.min(1, (max || 1600) / Math.max(img.width, img.height));
  const c = document.createElement('canvas');
  c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
  const g = c.getContext('2d');
  g.drawImage(img, 0, 0, c.width, c.height);
  if (stamp) {
    const fs = Math.max(14, Math.round(c.width / 32));
    const lines = stamp.split('\n');
    const bh = fs * 1.45 * lines.length + fs;
    g.fillStyle = 'rgba(0,0,0,.55)'; g.fillRect(0, c.height - bh, c.width, bh);
    g.fillStyle = '#fff'; g.font = `600 ${fs}px sans-serif`;
    lines.forEach((l, i) => g.fillText(l, fs * .7, c.height - bh + fs * 1.3 + i * fs * 1.45));
  }
  return c.toDataURL('image/jpeg', .74).split(',')[1];
}
async function uploadFile(file, folder) {
  if (file.size > 25 * 1024 * 1024) throw new Error('Ukuran berkas maksimal 25 MB.');
  let data, mime = file.type || 'application/octet-stream', name = file.name;
  if (mime.indexOf('image') === 0 && !/gif|svg/.test(mime)) { data = await shrink(file, 2000); mime = 'image/jpeg'; name = name.replace(/\.\w+$/, '') + '.jpg'; }
  else data = await readB64(file);
  const r = await call('upload', { folder, name, mime, data });
  /* gambar kecil disimpan di Supabase, kecuali dokumen kependudukan (privat) */
  if (mime.indexOf('image') === 0 && String(folder || '').split('/')[0] !== 'Penduduk') {
    try { const t = await makeThumb(file); THUMB[r.id] = t; await call('thumbSave', { id: r.id, data: t }); } catch (e) { }
  }
  return r;
}

  if (navigator.geolocation) {

      let txt = 'Lokasi didapat (akurasi ±' + Math.round(p.coords.accuracy) + ' m)';
      let ok = true;
      if (st.kantor_lat && st.kantor_lng) {
        const dj = jarakM(+pos.lat, +pos.lng, +st.kantor_lat, +st.kantor_lng);
        txt = dj + ' m dari kantor desa';
        if (st.wajib_radius === 'ya' && /Masuk|Pulang/.test(jenis) && dj > Number(st.radius_m || 150)) { ok = false; txt += ' — di luar batas ' + st.radius_m + ' m'; }
      }
      gps.className = 'gps ' + (ok ? 'ok' : 'bad'); gps.innerHTML = ic('pin') + '<span>' + esc(txt) + '</span>';
      autoSend();
    }, err => {
      gps.className = 'gps bad';
      gps.innerHTML = ic('pin') + '<span>' + 'Lokasi tidak dapat dibaca. Aktifkan GPS dan izinkan akses lokasi untuk aplikasi ini.' + '</span>';
    }, { enableHighAccuracy: true, timeout: 20000, maximumAge: 30000 });
  } else { gps.className = 'gps bad'; gps.innerHTML = ic('pin') + '<span>Perangkat tidak mendukung GPS.</span>'; }

  /* --- verifikasi wajah --- */

  if (needFace) {

      m.close(); toast('Presensi tercatat: ' + r.status); refresh();
    } catch (x) { showErr(x.message); b.disabled = false; b.innerHTML = ic('check') + 'Kirim presensi ' + esc(jenis.toLowerCase()); }
  };
}

/* ---------------- Pengenal wajah (di perangkat) ----------------
   Memakai face-api (TensorFlow.js). Kamera hanya dipakai di HP ini;
   yang dikirim ke server hanya 128 angka pola wajah, bukan gambar. */
const FACE_LIB = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.15/dist/face-api.js';
const FACE_MODELS = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.15/model';
let faceReady = null;
function loadFace() {
  if (faceReady) return faceReady;
  faceReady = new Promise((res, rej) => {
    if (window.faceapi) return res();
    const s = document.createElement('script'); s.src = FACE_LIB; s.onload = res;
    s.onerror = () => rej(new Error('Pengenal wajah gagal dimuat. Periksa internet lalu coba lagi.'));
    document.head.appendChild(s);
  }).then(() => Promise.all([
    faceapi.nets.tinyFaceDetector.loadFromUri(FACE_MODELS),
    faceapi.nets.faceLandmark68Net.loadFromUri(FACE_MODELS),
    faceapi.nets.faceRecognitionNet.loadFromUri(FACE_MODELS)
  ])).catch(e => { faceReady = null; throw new Error('Pengenal wajah gagal dimuat. Periksa internet lalu coba lagi.'); });
  return faceReady;
}
const sleep = ms => new Promise(r => setTimeout(r, ms));
function vMean(list) { const o = new Array(128).fill(0); list.forEach(v => v.forEach((x, i) => o[i] += x / list.length)); return o; }
function vDist(a, b) { let s = 0; for (let i = 0; i < a.length; i++) s += (a[i] - b[i]) * (a[i] - b[i]); return Math.sqrt(s); }
/* Pindai wajah + cek wajah hidup: lihat lurus, toleh ke satu sisi, toleh ke sisi lain, lihat lurus lagi. */
async function faceScan(box, enroll) {
  const video = $('video', box), msg = $('.fmsg', box), bar = $('.fbar i', box);
  const say = (t, p) => { msg.textContent = t; if (p != null) bar.style.width = p + '%'; };
  box.classList.remove('done');
  say('Memuat pengenal wajah… (pertama kali ±6 MB)', 5);
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('Kamera tidak didukung di peramban ini.');
  const camP = navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } }, audio: false })
    .catch(() => { throw new Error('Kamera tidak dapat dibuka. Izinkan akses kamera untuk aplikasi ini.'); });
  let stream;
  try { [stream] = await Promise.all([camP, loadFace()]); }
  catch (e) { camP.then(s => s.getTracks().forEach(t => t.stop())).catch(() => { }); throw e; }
  const stop = () => stream.getTracks().forEach(t => t.stop());
  box._stop = stop;
  try {
    video.srcObject = stream;
    await video.play();
    const opt = new faceapi.TinyFaceDetectorOptions({ inputSize: 224, scoreThreshold: .5 });
    const NEED = enroll ? 5 : 2;
    const t0 = Date.now();
    let stage = 0, side = 0, lastSeen = Date.now(), front = [];
    const restart = t => { stage = 0; side = 0; front = []; say(t, 10); };
    say('Lihat lurus ke kamera', 10);
    while (true) {
      if (!box.isConnected) throw new Error('Dibatalkan.');
      if (Date.now() - t0 > 45000) throw new Error('Waktu habis. Coba lagi di tempat yang lebih terang.');
      const withDesc = stage === 0 || stage === 3;
      let q = faceapi.detectSingleFace(video, opt).withFaceLandmarks();
      if (withDesc) q = q.withFaceDescriptor();
      const det = await q;
      if (!det) {
        if (stage > 0 && Date.now() - lastSeen > 2500) restart('Wajah hilang dari kamera. Mulai lagi: lihat lurus ke kamera');
        else if (stage === 0) say('Wajah belum terlihat. Hadapkan wajah ke kamera', 10);
        await sleep(100); continue;
      }
      lastSeen = Date.now();
      const p = det.landmarks.positions;
      const yaw = (p[30].x - p[36].x) / ((p[45].x - p[36].x) || 1);
      if (det.detection.box.width < video.videoWidth * .18) { say('Dekatkan wajah ke kamera', null); continue; }
      const lurus = Math.abs(yaw - .5) < .1;
      if (stage === 0) {
        if (lurus) front.push(Array.from(det.descriptor));
        say('Lihat lurus ke kamera… tahan sebentar', 10 + front.length / NEED * 30);
        if (front.length >= NEED) { stage = 1; say('Toleh kepala perlahan ke kiri atau kanan', 45); }
      } else if (stage === 1) {
        if (yaw < .38) { side = -1; stage = 2; } else if (yaw > .62) { side = 1; stage = 2; }
        if (stage === 2) say('Bagus. Sekarang toleh ke arah sebaliknya', 65);
      } else if (stage === 2) {
        if (side < 0 ? yaw > .62 : yaw < .38) { stage = 3; say('Kembali lihat lurus ke kamera', 85); }
      } else if (stage === 3 && lurus) {
        const d = Array.from(det.descriptor);
        if (vDist(d, vMean(front)) > .45) { restart('Wajah berubah di tengah pemeriksaan. Mulai lagi: lihat lurus ke kamera'); continue; }
        front.push(d);
        say('Selesai', 100);
        return vMean(front).map(x => Math.round(x * 1e5) / 1e5);
      }
    }
  } finally { stop(); }
}

VIEWS.rekap = async (p, main, alive) => {
  const bulan = p.bulan || isoToday().slice(0, 7);

    <div class="meta">H hadir · T terlambat · DL dinas luar · I izin · S sakit · A tanpa keterangan · PA pulang awal. Kolom abu-abu = hari libur.</div>
    <div class="tbl-wrap"><table class="tbl"><thead><tr><th class="stk">Nama</th>${d.days.map(x => `<th class="c" title="${esc(x.libur || '')}">${Number(x.tgl.slice(8))}</th>`).join('')}<th class="c">Kerja</th>${L.map(k => `<th class="c">${k}</th>`).join('')}</tr></thead>
    <tbody>${d.users.map(u => `<tr><td class="stk"><b>${esc(u.nama)}</b><div class="meta">${esc(u.jabatan)}</div></td>${d.days.map(x => { const k = u.masuk[x.tgl]; return `<td class="c ${x.libur ? 'lib' : ''}">${k ? `<span class="k k-${k}">${k}</span>` : ''}</td>`; }).join('')}<td class="c"><b>${u.jml.hari_kerja}</b></td>${L.map(k => `<td class="c">${u.jml[k] || 0}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
  </div>`;

  S.vh.cetak = () => printDocs('Rekap Presensi', [docRekap(d)]);
};

function rekapCompute(r) {
  const K = { 'Hadir': 'H', 'Hadir Terlambat': 'T', 'Dinas Luar': 'DL', 'Izin': 'I', 'Sakit': 'S' };
  return {
    bulan: r.bulan, days: r.days, users: r.users.map(usr => {
      const masuk = {}, pulang = {};
      r.recs.filter(x => x.user_id === usr.id).forEach(x => {
        if (x.jenis === 'Pulang') pulang[x.tanggal] = x.status === 'Pulang Awal' ? 'PA' : 'P';
        else if (!masuk[x.tanggal] || x.jenis !== 'Dinas Luar') masuk[x.tanggal] = K[x.status] || K[x.jenis] || '?';
      });
      const j = { hari_kerja: 0, H: 0, T: 0, DL: 0, I: 0, S: 0, P: 0, PA: 0, A: 0 };
      r.days.forEach(d => {
        if (d.libur) return;
        j.hari_kerja++;
        const k = masuk[d.tgl];
        if (k) j[k] = (j[k] || 0) + 1;
        else if (d.tgl < r.today) { j.A++; masuk[d.tgl] = 'A'; }
        if (pulang[d.tgl]) j[pulang[d.tgl]]++;
      });
      return { id: usr.id, nama: usr.nama, jabatan: usr.jabatan, masuk, pulang, jml: j };
    })
  };
}

function readForm(u, root) {

}

      ${g[0] === 'Jam kerja' ? `<div class="f"><span class="lbl">Libur mingguan</span><div class="checks" id="libm">${['Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu', 'Minggu'].map((d, i) => `<label><input type="checkbox" value="${i + 1}" ${lib.indexOf(String(i + 1)) >= 0 ? 'checked' : ''}>${d}</label>`).join('')}</div></div><button class="btn sm" type="button" data-act="go" data-go='["list",{"e":"hari_libur"}]' style="align-self:flex-start">${ic('cal')}Atur hari libur nasional & cuti bersama</button>` : ''}
      ${g[0] === 'Lokasi kantor' ? `<div class="btns"><button class="btn sm" type="button" data-act="here">${ic('pin')}Pakai lokasi saya sekarang</button><label class="switch"><input type="checkbox" id="s_wajib" ${s.wajib_radius === 'ya' ? 'checked' : ''}>Wajib di dalam radius untuk presensi masuk/pulang</label></div>` : ''}</div>`).join('')}
    <div id="serr" class="err" hidden></div>
    <div><button class="btn pri" type="submit">${ic('check')}Simpan pengaturan</button></div></form>`;
  S.vh.here = () => navigator.geolocation ? navigator.geolocation.getCurrentPosition(pp => { $('#s_kantor_lat').value = pp.coords.latitude.toFixed(6); $('#s_kantor_lng').value = pp.coords.longitude.toFixed(6); toast('Lokasi diisi. Tekan Simpan.'); }, () => toast('Lokasi tidak dapat dibaca.', 1), { enableHighAccuracy: true, timeout: 15000 }) : toast('Perangkat tidak mendukung GPS.', 1);
  $('#sf').onsubmit = async ev => {
    ev.preventDefault();
    const v = {};
    G.forEach(g => g[1].forEach(f => v[f[0]] = $('#s_' + f[0]).value.trim()));
    v.libur_mingguan = $$('#libm input:checked').map(i => i.value).join(',');
    v.wajib_radius = $('#s_wajib').checked ? 'ya' : 'tidak';
    v.face_threshold = v.face_threshold.replace(',', '.');
    try { S.set = await call('settingsSave', { values: v }); S.rkpYear = S.set.tahun_rkp || S.rkpYear; toast('Pengaturan disimpan.'); }
    catch (x) { $('#serr').textContent = x.message; $('#serr').hidden = false; }
  };
};

/* =====================================================================
   DOKUMEN CETAK
   ===================================================================== */
function kop() {
  const s = S.set;
  return `<div class="kop">${s.logo_url ? `<img src="${esc(s.logo_url)}" alt="">` : ''}<div><b>PEMERINTAH KABUPATEN ${esc(String(s.kabupaten || '').toUpperCase())}</b><b>KECAMATAN ${esc(String(s.kecamatan || '').toUpperCase())}</b><b class="big">DESA ${esc(String(s.nama_desa || '').toUpperCase())}</b><small>${esc(s.alamat || '')} ${s.kode_pos ? 'Kode Pos ' + esc(s.kode_pos) : ''}${s.email_desa ? ' · Email: ' + esc(s.email_desa) : ''}</small></div>${s.logo_url ? '<span style="width:70px"></span>' : ''}</div>`;
}
function ttdKades(tgl, extra) {
  const s = S.set;
  return `<div class="ttd"><div></div><div>${esc(s.nama_desa || '')}, ${tgl ? fDate(tgl) : '..............................'}<br>${extra || 'KEPALA DESA ' + esc(String(s.nama_desa || '').toUpperCase())}<div class="sp"></div><u>${esc(s.nama_kades || '..............................')}</u></div></div>`;
}
function cell(c, r) { return typeof c[1] === 'function' ? c[1](r) : esc(r[c[1]]); }
function docRegister(cfg, rows, per) {
  return `<div class="paper ${cfg.land ? 'land' : ''}">${cfg.form ? `<div style="text-align:right;font-size:10pt">${esc(cfg.form)}</div>` : ''}<h2>${esc(cfg.title)}</h2><h3>DESA ${esc(String(S.set.nama_desa || '').toUpperCase())}${per ? ' — ' + esc(String(per).toUpperCase()) : ''}</h3>
    <table class="pt"><thead><tr><th>No</th>${cfg.cols.map(c => `<th>${esc(c[0])}</th>`).join('')}</tr></thead><tbody>${rows.map((r, i) => `<tr><td style="text-align:center">${i + 1}</td>${cfg.cols.map(c => `<td>${cell(c, r) || ''}</td>`).join('')}</tr>`).join('') || `<tr><td colspan="${cfg.cols.length + 1}" style="text-align:center">Tidak ada data</td></tr>`}</tbody>
    ${cfg.foot ? `<tfoot><tr><td></td>${cfg.foot(rows).map(v => `<td><b>${v}</b></td>`).join('')}</tr></tfoot>` : ''}</table>${ttdKades(isoToday())}</div>`;
}
function docRekap(d) {
  const [y, m] = d.bulan.split('-').map(Number);
  const L = ['H', 'T', 'DL', 'I', 'S', 'A'];
  return `<div class="paper land" style="font-size:9pt">${kop()}<h2>REKAPITULASI KEHADIRAN PERANGKAT DESA</h2><h3>BULAN ${BULAN[m - 1].toUpperCase()} ${y}</h3>
  <table class="pt" style="font-size:7.5pt"><thead><tr><th>No</th><th>Nama / Jabatan</th>${d.days.map(x => `<th style="${x.libur ? 'background:#ddd' : ''}">${Number(x.tgl.slice(8))}</th>`).join('')}${L.map(k => `<th>${k}</th>`).join('')}</tr></thead>
  <tbody>${d.users.map((u, i) => `<tr><td>${i + 1}</td><td>${esc(u.nama)}<br><i>${esc(u.jabatan)}</i></td>${d.days.map(x => `<td style="text-align:center;${x.libur ? 'background:#ddd' : ''}">${u.masuk[x.tgl] || ''}</td>`).join('')}${L.map(k => `<td style="text-align:center">${u.jml[k] || 0}</td>`).join('')}</tr>`).join('')}</tbody></table>
  <div style="font-size:8pt">Keterangan: H = hadir, T = terlambat, DL = dinas luar, I = izin, S = sakit, A = tanpa keterangan. Kolom abu-abu = hari libur.</div>${ttdKades(isoToday())}</div>`;
}
async function rkpDoc(kind, mu) {
  const y = S.rkpYear;
  const listAll = (entity, extra) => call('list', Object.assign({ entity, limit: 5000, filters: { tahun_rkp: y } }, extra || {})).then(r => r.rows);
  if (kind === 'rktl') return printDocs('Form 03', [docRktl(await listAll('rkp_jadwal', { sort: 'tanggal', desc: false }))]);
  if (kind === 'f4') return printDocs('Form 04', [docRegister(UI.rkp_usulan.print, await listAll('rkp_usulan', { sort: 'kode_kegiatan', desc: false }), 'RKP Desa Tahun ' + y)]);
  if (kind === 'f5') return printDocs('Form 05', [docRegister(UI.rkp_pembiayaan.print, await listAll('rkp_pembiayaan', { sort: 'kode_bidang', desc: false }), 'RKP Desa Tahun ' + y)]);
  if (!mu) {
    const ms = (await listAll('rkp_musyawarah')).filter(x => /Pembentukan/i.test(x.musyawarah));
    if (!ms.length) throw new Error('Belum ada data "Musdes Pembentukan Tim RKP Desa" untuk tahun ' + y + '. Isi dulu di Form 01–02.');
    mu = ms[0];
  }
  const [tim, nara, hk] = await Promise.all([
    call('list', { entity: 'rkp_tim', filters: { ref: mu.id }, limit: 200, sort: 'urut', desc: false }).then(r => r.rows),
    call('list', { entity: 'rkp_narasumber', filters: { ref: mu.id }, limit: 100 }).then(r => r.rows),
    call('list', { entity: 'ref_hukum', limit: 200, sort: 'no', desc: false }).then(r => r.rows.filter(x => x.status !== 'Tidak Aktif'))
  ]);
  if (kind === 'ba') return printDocs('Berita Acara', [docBA(mu, tim, nara)]);
  if (kind === 'skp') return printDocs('SK Tim Penyusun', docSK(mu, tim.filter(x => x.jenis_tim === 'Tim Penyusun'), hk, 'penyusun'));
  if (kind === 'skv') return printDocs('SK Tim Verifikasi', docSK(mu, tim.filter(x => x.jenis_tim === 'Tim Verifikasi'), hk, 'verifikasi'));
}
function docBA(mu, tim, nara) {
  const d = parseD(mu.tanggal) || new Date();
  const s = S.set, y = mu.tahun_rkp;
  const tp = tim.filter(x => x.jenis_tim === 'Tim Penyusun');
  return `<div class="paper">${kop()}<div style="text-align:right;font-size:10pt">Form 01</div><h2>BERITA ACARA</h2><h3 style="text-transform:uppercase">MUSYAWARAH DESA TENTANG PEMBENTUKAN TIM PENYUSUN RENCANA KERJA PEMERINTAH DESA TAHUN ${esc(y)}</h3>
  <p>Pada hari ini ${HARI[d.getDay()]} tanggal ${terbilang(d.getDate())} bulan ${BULAN[d.getMonth()]} tahun ${terbilang(d.getFullYear())} (${fDate(mu.tanggal)}), pukul ${esc(String(mu.jam || '').slice(0, 5))} WIB, bertempat di ${esc(mu.tempat)}, telah diselenggarakan ${esc(mu.musyawarah)} yang dihadiri oleh unsur Pemerintah Desa, Badan Permusyawaratan Desa, dan unsur masyarakat sebagaimana daftar hadir terlampir.</p>
  <p>Musyawarah desa dipimpin oleh:</p>
  <div class="dict" style="margin-left:22px"><span>Nama</span><span>:</span><span>${esc(mu.pimpinan)}</span><span>Unsur</span><span>:</span><span>${esc(mu.unsur_pimpinan)}</span></div>
  <p>dengan notulen:</p>
  <div class="dict" style="margin-left:22px"><span>Nama</span><span>:</span><span>${esc(mu.notulen)}</span><span>Unsur</span><span>:</span><span>${esc(mu.unsur_notulen)}</span></div>
  ${nara.length ? `<p>Narasumber musyawarah:</p><ol>${nara.map(n => `<li>${esc(n.nama)} (${esc(n.unsur)})</li>`).join('')}</ol>` : ''}
  <p>Materi musyawarah adalah pembentukan Tim Penyusun Rencana Kerja Pemerintah Desa Tahun ${esc(y)}. Setelah dilakukan pembahasan, peserta musyawarah menyepakati susunan Tim Penyusun RKP Desa sebagai berikut:</p>
  <table class="pt"><thead><tr><th>No</th><th>Nama</th><th>Jabatan dalam Tim</th><th>Unsur</th></tr></thead><tbody>${tp.map((r, i) => `<tr><td style="text-align:center">${i + 1}</td><td>${esc(r.nama)}</td><td>${esc(r.jabatan_tim)}</td><td>${esc(r.unsur)}</td></tr>`).join('') || '<tr><td colspan="4" style="text-align:center">Belum diisi</td></tr>'}</tbody></table>
  ${mu.catatan ? `<p>Catatan: ${esc(mu.catatan)}</p>` : ''}
  <p>Demikian Berita Acara ini dibuat dengan sebenarnya untuk dapat dipergunakan sebagaimana mestinya.</p>
  <div class="ttd"><div>Pimpinan Musyawarah<br>${esc(mu.unsur_pimpinan)}<div class="sp"></div><u>${esc(mu.pimpinan)}</u></div><div>Notulen<br>${esc(mu.unsur_notulen)}<div class="sp"></div><u>${esc(mu.notulen)}</u></div></div>
  <div class="ttd"><div>Mengetahui,<br>Kepala Desa ${esc(s.nama_desa)}<div class="sp"></div><u>${esc(s.nama_kades || '..............................')}</u></div><div>Wakil Masyarakat<br>&nbsp;<div class="sp"></div><u>${esc(mu.wakil_masyarakat || '..............................')}</u></div></div></div>`;
}
function docSK(mu, tim, hk, jenis) {
  const s = S.set, y = mu.tahun_rkp;
  const judul = jenis === 'penyusun' ? 'PEMBENTUKAN TIM PENYUSUN RENCANA KERJA PEMERINTAH DESA TAHUN ' + y : 'PEMBENTUKAN TIM VERIFIKASI RENCANA KERJA PEMERINTAH DESA TAHUN ' + y;
  const nomor = jenis === 'penyusun' ? mu.no_sk_penyusun : mu.no_sk_verifikasi;
  const tugas = jenis === 'penyusun'
    ? ['Mencermati pagu indikatif desa dan penyelarasan program/kegiatan masuk ke desa;', 'Mencermati ulang dokumen RPJM Desa;', 'Menyusun rancangan RKP Desa; dan', 'Menyusun rancangan Daftar Usulan RKP Desa.']
    : ['Melakukan verifikasi terhadap rancangan RKP Desa, meliputi kesesuaian dengan RPJM Desa dan kewenangan desa;', 'Memeriksa kelayakan rancangan kegiatan dan Rencana Anggaran Biaya; dan', 'Menyampaikan hasil verifikasi kepada Tim Penyusun RKP Desa.'];
  const nk = String(s.nama_desa || '').toUpperCase();
  const p1 = `<div class="paper">${kop()}<div style="text-align:right;font-size:10pt">Form 02</div><h2>KEPUTUSAN KEPALA DESA ${esc(nk)}</h2><h3>NOMOR ${esc(nomor || '..............................')}<br><br>TENTANG<br>${esc(judul)}<br><br>KEPALA DESA ${esc(nk)},</h3>
  <table class="kv"><tr><td style="width:110px">Menimbang</td><td>:</td><td><ol type="a" style="margin:0"><li>bahwa dalam rangka penyusunan Rencana Kerja Pemerintah Desa Tahun ${esc(y)} perlu dibentuk ${jenis === 'penyusun' ? 'Tim Penyusun' : 'Tim Verifikasi'} RKP Desa;</li><li>bahwa berdasarkan hasil Musyawarah Desa tanggal ${fDate(mu.tanggal)}, perlu menetapkan Keputusan Kepala Desa tentang ${esc(judul.toLowerCase().replace(/(^|\s)\S/g, t => t.toUpperCase()))};</li></ol></td></tr>
  <tr><td>Mengingat</td><td>:</td><td><ol style="margin:0">${hk.map(h => `<li>${esc(h.rincian)};</li>`).join('') || '<li>..............................</li>'}</ol></td></tr></table>
  <h3 style="margin-top:12px">MEMUTUSKAN:</h3>
  <table class="kv"><tr><td style="width:110px">Menetapkan</td><td>:</td><td><b>KEPUTUSAN KEPALA DESA TENTANG ${esc(judul)}.</b></td></tr>
  <tr><td>KESATU</td><td>:</td><td>Membentuk ${jenis === 'penyusun' ? 'Tim Penyusun' : 'Tim Verifikasi'} Rencana Kerja Pemerintah Desa Tahun ${esc(y)} dengan susunan sebagaimana tercantum dalam Lampiran yang merupakan bagian tidak terpisahkan dari Keputusan ini.</td></tr>
  <tr><td>KEDUA</td><td>:</td><td>Tim sebagaimana dimaksud Diktum KESATU mempunyai tugas:<ol type="a" style="margin:2px 0">${tugas.map(t => `<li>${esc(t)}</li>`).join('')}</ol></td></tr>
  <tr><td>KETIGA</td><td>:</td><td>Segala biaya yang timbul akibat ditetapkannya Keputusan ini dibebankan pada Anggaran Pendapatan dan Belanja Desa ${esc(s.nama_desa)} Tahun Anggaran ${Number(y) - 1}.</td></tr>
  <tr><td>KEEMPAT</td><td>:</td><td>Keputusan ini mulai berlaku pada tanggal ditetapkan.</td></tr></table>
  <div class="ttd"><div></div><div>Ditetapkan di ${esc(s.nama_desa)}<br>pada tanggal ${mu.tgl_sk ? fDate(mu.tgl_sk) : '..............................'}<br>KEPALA DESA ${esc(nk)}<div class="sp"></div><u>${esc(s.nama_kades || '..............................')}</u></div></div></div>`;
  const p2 = `<div class="paper"><table class="kv" style="margin-left:auto;font-size:10.5pt"><tr><td>LAMPIRAN</td><td>:</td><td>KEPUTUSAN KEPALA DESA ${esc(nk)}</td></tr><tr><td>NOMOR</td><td>:</td><td>${esc(nomor || '')}</td></tr><tr><td>TANGGAL</td><td>:</td><td>${mu.tgl_sk ? fDate(mu.tgl_sk) : ''}</td></tr></table>
  <h2 style="margin-top:16px">SUSUNAN ${jenis === 'penyusun' ? 'TIM PENYUSUN' : 'TIM VERIFIKASI'} RKP DESA TAHUN ${esc(y)}</h2>
  <table class="pt"><thead><tr><th>No</th><th>Nama</th><th>Tempat, Tgl Lahir</th><th>Jabatan dalam Tim</th><th>Unsur</th></tr></thead><tbody>${tim.map((r, i) => `<tr><td style="text-align:center">${i + 1}</td><td>${esc(r.nama)}</td><td>${esc(r.tempat_lahir || '')}${r.tgl_lahir ? ', ' + fDate(r.tgl_lahir) : ''}</td><td>${esc(r.jabatan_tim)}</td><td>${esc(r.unsur)}</td></tr>`).join('') || '<tr><td colspan="5" style="text-align:center">Belum diisi</td></tr>'}</tbody></table>
  <div class="ttd"><div></div><div>KEPALA DESA ${esc(nk)}<div class="sp"></div><u>${esc(s.nama_kades || '..............................')}</u></div></div></div>`;
  return [p1, p2];
}
function docRktl(rows) {
  const y = S.rkpYear;
  return `<div class="paper land">${kop()}<div style="text-align:right;font-size:10pt">Form 03</div><h2>RENCANA KERJA DAN TINDAK LANJUT</h2><h3>PENYUSUNAN RKP DESA TAHUN ${esc(y)}</h3>
  <table class="pt"><thead><tr><th>No</th><th>Hari, Tanggal</th><th>Pukul</th><th>Tempat</th><th>Uraian Kegiatan</th><th>Keterangan</th><th>Keluaran</th></tr></thead>
  <tbody>${rows.map(r => `<tr><td>${esc(r.no)}</td><td>${fDay(r.tanggal)}</td><td>${esc(String(r.jam || '').slice(0, 5))}${r.sampai ? ' s/d ' + esc(r.sampai) : ''}</td><td>${esc(r.tempat)}</td><td style="white-space:pre-wrap">${esc(r.uraian)}</td><td style="white-space:pre-wrap">${esc(r.keterangan)}</td><td style="white-space:pre-wrap">${esc(r.keluaran)}</td></tr>`).join('') || '<tr><td colspan="7" style="text-align:center">Belum ada jadwal</td></tr>'}</tbody></table>${ttdKades(isoToday(), 'KEPALA DESA ' + esc(String(S.set.nama_desa || '').toUpperCase()) + '<br>selaku Pembina Tim Penyusun')}</div>`;
}
function printDocs(title, pages) {
  const html = pages.join('');
  const m = modal(title, `<div class="stack"><div class="btns"><button class="btn pri" id="doPrint">${ic('print')}Cetak / simpan PDF</button></div><div class="meta">Pilih "Simpan sebagai PDF" di jendela cetak untuk menyimpan berkas.</div><div class="doc-prev">${html}</div></div>`, { big: 1 });
  const fit = () => { const box = $('.doc-prev', m.el); if (!box) return; $$('.paper', box).forEach(pp => { pp.style.zoom = 1; const w = pp.getBoundingClientRect().width; const avail = box.clientWidth - 24; pp.style.zoom = w > avail ? (avail / w).toFixed(3) : 1; }); };
  requestAnimationFrame(fit);
  $('#doPrint', m.el).onclick = () => {
    $('#printArea').innerHTML = html;
    const land = pages.some(p => /paper land/.test(p));
    let st = $('#pgsz'); if (!st) { st = document.createElement('style'); st.id = 'pgsz'; document.head.appendChild(st); }
    st.textContent = '@media print{@page{size:A4 ' + (land ? 'landscape' : 'portrait') + ';margin:0}}';
    setTimeout(() => window.print(), 50);
  };
}

applyTheme();
/* dipakai oleh atribut onclick di HTML */
window.refresh = refresh; window.loginScreen = loginScreen; window.boot = boot;
window.__pwTest = { go, logoutLocal, store };
boot();
})();
